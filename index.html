<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DayPlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f6f8f9;--card:#fff;--ink:#0f172a;--ink-2:#64748b;--ink-3:#94a3b8;--line:#eef1f4;--line-2:#e2e8f0;
 --green:#22c55e;--green-600:#16a34a;--green-tint:#e9f9ef;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;--teal:#14b8a6;--indigo:#6366f1;
 --radius:16px;--shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.05);--shadow-pop:0 16px 46px rgba(15,23,42,.20);
}
body.dark{
 --bg:#0b1220;--card:#141c2e;--ink:#e7ecf3;--ink-2:#93a1b5;--ink-3:#6b7a90;--line:#222e44;--line-2:#2c3a52;--green-tint:#12321f;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.app{display:flex;min-height:100vh;gap:22px;padding:22px;max-width:1500px;margin:0 auto}
/* sidebar */
.sidebar{width:238px;flex:0 0 238px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:22px;height:calc(100vh - 44px);overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#22c55e,#16a34a);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.brand h1{font-size:16px;font-weight:800;margin:0}.brand span{font-size:11px;color:var(--ink-3);font-weight:500}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink-2);font-weight:600;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:.14s}
.nav-item svg{width:18px;height:18px;flex:0 0 18px}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--green-tint);color:var(--green-600)}
.side-card{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px;text-align:center}
.ring{width:104px;height:104px;border-radius:50%;margin:6px auto 10px;position:relative;display:grid;place-items:center}
.ring::after{content:"";position:absolute;inset:11px;background:var(--card);border-radius:50%}
.ring .rn{position:relative;z-index:1;font-size:24px;font-weight:800}
.side-title{font-weight:700;font-size:13.5px}
.side-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.focus-badge{width:74px;height:74px;border-radius:50%;border:3px solid var(--green-tint);display:grid;place-items:center;margin:8px auto 10px}
.focus-badge b{font-size:20px;font-weight:800}.focus-badge small{font-size:10px;color:var(--ink-3);display:block}
.btn{font-family:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--green-600);border-color:var(--green-600);color:#fff}.btn.primary:hover{background:#15803d}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn svg{width:16px;height:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:600;font-size:13.5px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;transition:.2s;flex:0 0 42px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet h2{font-size:24px;font-weight:800;margin:0}.greet p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px}
.top-actions{display:flex;align-items:center;gap:10px}
.datenav{display:flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--card);border-radius:11px;padding:4px}
.datenav button{border:none;background:none;cursor:pointer;color:var(--ink-2);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.datenav button:hover{background:var(--bg)}
.datenav .dl{font-weight:700;font-size:13.5px;padding:0 8px;min-width:118px;text-align:center}
.icon-btn{position:relative;width:42px;height:42px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--bg)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.card-head h3{margin:0;font-size:15.5px;font-weight:700}
.sub{font-size:12px;color:var(--ink-3);margin:-6px 0 12px}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;gap:13px;align-items:flex-start}
.stat .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px}
.stat .sl{font-size:12px;color:var(--ink-2);font-weight:600}
.stat .sv{font-size:21px;font-weight:800;margin:3px 0 2px}
.stat .sm{font-size:11.5px;color:var(--ink-3);font-weight:500}
/* layout */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:3px}
.tabs button{border:none;background:none;font-family:inherit;font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--card);color:var(--green-600);box-shadow:var(--shadow)}
/* timeline */
.tl-item{display:grid;grid-template-columns:74px 1fr;gap:12px;position:relative}
.tl-time{text-align:right;font-size:12px;font-weight:700;color:var(--ink-2);padding-top:16px;white-space:pre-line;line-height:1.3}
.tl-mid{position:relative;padding-left:22px;padding-bottom:12px}
.tl-mid::before{content:"";position:absolute;left:5px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--dotc,var(--green));box-shadow:0 0 0 3px var(--card)}
.tl-mid::after{content:"";position:absolute;left:10px;top:16px;bottom:-6px;width:2px;background:var(--line-2)}
.tl-item:last-child .tl-mid::after{display:none}
#tlBody{position:relative}
.tl-now{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;z-index:6;display:none;transition:transform .6s linear}
.tl-now-dot{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px var(--card);position:relative}
.tl-now-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#ef4444;animation:tlPulse 1.8s ease-out infinite}
@keyframes tlPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}
.act{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--card);transition:.25s;position:relative}
.act:hover{border-color:var(--line-2)}
.act.done{opacity:1;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
.act.act-now{border-color:#f59e0b;background:rgba(245,158,11,.10);animation:actBlink 1.6s ease-in-out infinite}
.act.act-now::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:13px 0 0 13px;background:#f59e0b}
.act.act-missed{border-color:#ef4444;background:rgba(239,68,68,.07)}
.act.act-missed::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:13px 0 0 13px;background:#ef4444}
@keyframes actBlink{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.45)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.act .aic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px}
.act .an{font-weight:700;font-size:13.5px}
.act.done .an{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.act .at{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.act .ar{margin-left:auto;display:flex;align-items:center;gap:6px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;display:grid;place-items:center;color:transparent;transition:.14s;background:none}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk.skip{background:var(--amber);border-color:var(--amber);color:#fff}
.chk.post{background:var(--blue);border-color:var(--blue);color:#fff}
.dots{border:none;background:none;color:var(--ink-3);cursor:pointer;width:26px;height:26px;border-radius:7px}
.dots:hover{background:var(--bg);color:var(--ink)}
.st-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:6px}
.st-tag.skipped{background:#fef3e2;color:#b45309}.st-tag.postponed{background:#e9f2ff;color:#2563eb}.st-tag.missed{background:#fee2e2;color:#dc2626}
body.dark .st-tag.skipped{background:#3a2a12}body.dark .st-tag.postponed{background:#16233c}body.dark .st-tag.missed{background:#3a1414}
/* weekly overview */
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.week .wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .wbar{width:100%;max-width:26px;background:var(--green-tint);border-radius:7px;display:flex;align-items:flex-end;overflow:hidden;height:100%}
.week .wbar>i{width:100%;background:linear-gradient(180deg,#22c55e,#16a34a);border-radius:7px;transition:height .5s}
.week .wl{font-size:11px;color:var(--ink-3);font-weight:600}.week .wp{font-size:11px;font-weight:700}
.wdh{display:flex;gap:8px;margin-bottom:2px}.wdh span{flex:1;text-align:center;font-size:11px;color:var(--ink-3);font-weight:600}
/* progress rows */
.pr{margin-bottom:13px}.pr:last-child{margin-bottom:0}
.pr-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.pr-top .pv{color:var(--ink-3);font-weight:700;font-size:12px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
/* upcoming */
.up{display:flex;align-items:center;gap:12px;padding:10px 0}.up+.up{border-top:1px solid var(--line)}
.up .uic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.up .un{font-weight:700;font-size:13px}.up .ut{font-size:11.5px;color:var(--ink-3)}
/* habits */
.hb{display:flex;align-items:center;gap:11px;padding:9px 0}.hb+.hb{border-top:1px solid var(--line)}
.hb .hchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);cursor:pointer;display:grid;place-items:center;color:transparent;flex:0 0 22px}
.hb .hchk.on{background:var(--green);border-color:var(--green);color:#fff}
.hb .hn{font-weight:600;font-size:13.5px;flex:1}
.hstreak{font-size:11px;color:var(--ink-3);font-weight:700}
.wk-dots{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);justify-content:space-between}
.wk-dots .d{text-align:center;flex:1}.wk-dots .dl{font-size:10.5px;color:var(--ink-3);font-weight:700}
.wk-dots .dc{width:22px;height:22px;border-radius:50%;margin:5px auto 0;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent}
.wk-dots .dc.on{background:var(--green);border-color:var(--green);color:#fff}
/* tips */
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tip{display:flex;gap:11px}
.tip .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.tip .tt{font-weight:700;font-size:13px}.tip .td{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
/* banner */
.banner{background:linear-gradient(120deg,#e9f9ef,#eafaf1);border:1px solid #c9efd6;border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px}
body.dark .banner{background:linear-gradient(120deg,#12321f,#0f2a1a);border-color:#1c4a2e}
.banner .bic{width:46px;height:46px;border-radius:13px;background:var(--card);display:grid;place-items:center;color:var(--green-600);flex:0 0 46px;box-shadow:var(--shadow)}
.banner .bt{font-weight:800;font-size:16px}.banner .bd{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.warn-box{border:1px solid #f6d9a8;background:#fef7ec;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:#92600c}
body.dark .warn-box{background:#2a2110;border-color:#4a3a16;color:#e0b464}
.warn-box b{font-weight:700}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:20px 0}
.pri{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.pri .pn{width:24px;height:24px;border-radius:7px;background:var(--green-tint);color:var(--green-600);display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 24px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:60;padding:20px;opacity:0;pointer-events:none;transition:.18s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-pop);width:100%;max-width:520px;max-height:90vh;overflow:auto;transform:translateY(8px) scale(.98);transition:.18s}
.overlay.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-head h3{margin:0;font-size:17px;font-weight:800}
.modal-body{padding:18px 20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);outline:none}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.close-x{background:none;border:none;cursor:pointer;color:var(--ink-3);width:34px;height:34px;border-radius:9px}.close-x:hover{background:var(--bg);color:var(--ink)}
.icon-pick{display:flex;flex-wrap:wrap;gap:7px}
.icon-pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icon-pick button.on{border-color:var(--green);color:var(--green-600);background:var(--green-tint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--bg);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--green-tint);border-color:var(--green);color:var(--green-600)}
.menu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;z-index:70;min-width:160px}
.menu button{width:100%;text-align:left;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;padding:8px 11px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:9px}
.menu button:hover{background:var(--bg)}.menu button.dngr{color:var(--red)}
/* focus overlay */
.focus-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0b1220,#0f2a1a);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;color:#e7ecf3;text-align:center;padding:24px}
.focus-screen.show{display:flex}
.focus-screen .ftask{font-size:13px;color:#93a1b5;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.focus-screen .ftitle{font-size:30px;font-weight:800;margin:8px 0 26px}
.ftimer{width:250px;height:250px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:26px}
.ftimer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ftimer .fnum{font-size:52px;font-weight:800;letter-spacing:-1px}
.fnext{color:#93a1b5;font-size:13px;margin-bottom:26px}
.fctrls{display:flex;gap:12px}
.fctrls .btn{padding:12px 20px;font-size:14px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#e7ecf3}
.fctrls .btn.primary{background:var(--green-600);border-color:var(--green-600);color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:var(--shadow-pop)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- goals dashboard ---- */
.goals-grid{display:grid;grid-template-columns:250px 1fr 300px;gap:20px;align-items:start}
.selectlike{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;outline:none}
.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);border:none;background:none;width:100%;text-align:left;font-family:inherit}
.cat-row:hover{background:var(--bg)}
.cat-row.on{background:var(--green-tint);color:var(--green-600)}
.cat-row .ci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 28px}
.cat-row .cn{flex:1}
.cat-row .cc{font-weight:700;font-size:12px;color:var(--ink-3)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center}
.badge-ic.locked{background:var(--bg);color:var(--ink-3)}
.badge-label{font-size:10px;font-weight:700;color:var(--ink-2);line-height:1.25}
.badge-item.locked .badge-label{color:var(--ink-3)}
.goal-card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:.15s}
.goal-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.goal-card.is-completed{opacity:.8}
.goal-card.is-overdue{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.035)}
.gc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gc-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:0 0 46px}
.gc-title{font-weight:800;font-size:15px}

const PREF='dp:pref';
const MEM={};
const DESK=(typeof window!=='undefined')&&window.dayplan&&window.dayplan.isDesktop?window.dayplan:null;
const hasStore=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';
// plain-browser (non-Electron, no host `window.storage`) persistence — lets the same renderer
// run as a regular web page and still keep data across reloads via the browser's own localStorage
const hasLocal=(()=>{try{return !DESK&&!hasStore&&typeof localStorage!=='undefined'&&!!localStorage;}catch(e){return false;}})();
const DB={
 async get(k){
   if(DESK){try{const v=await DESK.store.get(k);if(v!=null)return v;}catch(e){}}
   else if(hasStore){try{const r=await window.storage.get(k,false);if(r&&r.value!=null)return JSON.parse(r.value);}catch(e){}}
   else if(hasLocal){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v);}catch(e){}}
   return MEM[k]!=null?JSON.parse(MEM[k]):null;
 },
 async set(k,v){
   MEM[k]=JSON.stringify(v);
   if(DESK){try{await DESK.store.set(k,v);}catch(e){}}
   else if(hasStore){try{await window.storage.set(k,MEM[k],false);}catch(e){}}
   else if(hasLocal){try{localStorage.setItem(k,MEM[k]);}catch(e){}}
   return true;
 },
 async list(p){
   let keys=Object.keys(MEM).filter(k=>k.startsWith(p||''));
   if(DESK){try{const r=await DESK.store.list(p);if(r)keys=Array.from(new Set(keys.concat(r)));}catch(e){}}
   else if(hasStore){try{const r=await window.storage.list(p,false);if(r&&r.keys)keys=Array.from(new Set(keys.concat(r.keys)));}catch(e){}}
   else if(hasLocal){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p||''))keys.push(k);}keys=Array.from(new Set(keys));}catch(e){}}
   return keys;
 },
 async delete(k){
   delete MEM[k];
   if(DESK){try{await DESK.store.delete(k);}catch(e){}}
   else if(hasLocal){try{localStorage.removeItem(k);}catch(e){}}
   return true;
 },
};

/* auto-link each new recurring-shared occurrence to MY OWN DayPlan at the template's default time —
   mirrors ensureRecurringOccurrences() for local tasks, but only ever touches this device's own
   day.activities, never another member's calendar */
async function ensureTeamRecurringSchedules(){
 const items=allSharedRecurringTasks().filter(x=>x.rt.schedStart&&x.rt.schedEnd);
 for(const {teamId,rt} of items){
   const occs=allSharedTasks().filter(x=>x.teamId===teamId&&x.task.recurringId===rt.id);
   for(const {task} of occs){
     const d=await DB.get(dayKey(task.occurrenceDate));
     const already=d&&(d.activities||[]).some(a=>a.workTaskId===task.id);
     if(!already)await scheduleTaskToDayPlan(task,task.occurrenceDate,rt.schedStart,rt.schedEnd);
   }
 }
}
function emailColor(email){let h=0;for(let i=0;i<email.length;i++)h=(h*31+email.charCodeAt(i))>>>0;return ACT_COLORS[h%ACT_COLORS.length];}

async function collectSyncableEntries(){
 const keys=await DB.list('dp:');
 const entries=[];
 for(const k of keys){
   if(k===ACCOUNT_KEY)continue; // never sync the session token itself
   const v=await DB.get(k);
   if(v==null)continue;
   entries.push({key:k,value:v});
 }
 return entries;
}
async function syncRound(pullOnly){
 const changes=[];
 if(!pullOnly){
   const entries=await collectSyncableEntries();
   const now=Date.now();
   for(const {key,value} of entries){
     const ser=JSON.stringify(value);
     if(syncState.pushed[key]!==ser)changes.push({key,value:ser,updatedAt:now});
   }
 }
 const data=await apiFetch('/api/store/sync',{method:'POST',headers:{Authorization:'Bearer '+account.token},body:JSON.stringify({since:syncState.lastPulledAt,changes})});
 changes.forEach(c=>{syncState.pushed[c.key]=c.value;});
 let touchedCurrent=false;
 for(const c of data.changes){
   if(c.key===ACCOUNT_KEY)continue;
   if(c.deleted){
     await DB.delete(c.key);delete syncState.pushed[c.key];
     if(c.key===dayKey(dayStr))touchedCurrent=true;
   }else{
     const parsed=JSON.parse(c.value);
     await DB.set(c.key,parsed);syncState.pushed[c.key]=c.value;
     if(c.key===PREF){pref=parsed;touchedCurrent=true;}
     else if(c.key===dayKey(dayStr)){day=parsed;touchedCurrent=true;}
   }
 }
 syncState.lastPulledAt=data.serverTime;
 lastSyncedAt=data.serverTime;
 return touchedCurrent;
}
async function syncNow(){
 if(!syncEnabled()||syncState.syncing)return;
 syncState.syncing=true;
 try{
   // always pull and merge remote changes BEFORE computing what to push. A day's data is synced
   // as one whole blob per key, and fields like screenMin auto-update on their own — so if we
   // pushed using a locally-stale blob (one that hasn't yet absorbed a newer edit another device
   // made to the same day), that stale push would clobber the newer edit via last-write-wins.
   // Pulling first ensures every push starts from the freshest known state.
   let touchedCurrent=await syncRound(true);
   touchedCurrent=await syncRound(false)||touchedCurrent;
   if(touchedCurrent&&typeof render==='function')render();
 }catch(e){
   if(e.status===401){account=null;await DB.delete(ACCOUNT_KEY);toast('Sync session expired — please log in again.');}
   console.error('sync failed',e);
 }
 syncState.syncing=false;
}
setInterval(()=>{if(syncEnabled())syncNow();},120000);

/* ============ Time helpers ============ */
const DAYNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function toHM(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function fmt12(t){const[h,m]=t.split(':').map(Number);const ap=h<12?'AM':'PM';const hh=h%12||12;return hh+':'+String(m).padStart(2,'0')+' '+ap;}
function durLabel(s,e){let d=toMin(e)-toMin(s);if(d<=0)d+=1440;const h=Math.floor(d/60),m=d%60;return (h?h+'h':'')+(m?(h?' ':'')+m+'m':'');}
function interval(a){let s=toMin(a.start),e=toMin(a.end);if(e<=s)e+=1440;return [s,e];}
function isNowActive(a){if(a.status!=='pending'||dayStr!==todayStr())return false;const n=nowMin(),s=toMin(a.start);let e=toMin(a.end);if(e<=s){return n>=s||n<e;}return n>=s&&n<e;}
/* an activity is "missed" once its own end time has passed while it's still sitting pending — never auto-set, purely a display state until the user acts on it */
function isMissedOn(ds,a){if(a.status!=='pending'||ds>todayStr())return false;const [,e]=interval(a);const n=ds===todayStr()?nowMin():1440;return n>=e;}
function isMissed(a){return isMissedOn(dayStr,a);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(ds,n){const[y,m,d]=ds.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()+n);return dt.toISOString().slice(0,10);}
function dowOf(ds){return new Date(ds+'T00:00').getDay();}
function dateLabel(ds){const d=new Date(ds+'T00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function hoursLabel(min){const h=Math.floor(min/60),m=Math.round(min%60);return (h?h+'h ':'')+(m?m+'m':(h?'':'0m'));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function num(v){return Math.max(0,Number(String(v).replace(/[^0-9.]/g,''))||0);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ============ Templates / recurrence ============ */
const RECUR=[['daily','Every day'],['weekday','Weekdays'],['weekend','Weekends'],['weekly','Specific days'],['once','One time']];
function appliesToday(t,ds){const dw=dowOf(ds);if(t.recur==='daily')return true;if(t.recur==='weekday')return dw>=1&&dw<=5;if(t.recur==='weekend')return dw===0||dw===6;if(t.recur==='weekly'||t.recur==='custom')return (t.days||[]).includes(dw);if(t.recur==='once')return t.date===ds;return false;}
function generateActivities(ds){
 return (pref.templates||[]).filter(t=>appliesToday(t,ds)).map(t=>({id:id(),tid:t.id,title:t.title,icon:t.icon,color:t.color,start:t.start,end:t.end,status:'pending',goalId:t.goalId||null}))
   .sort((a,b)=>toMin(a.start)-toMin(b.start));
}

/* ============ Conflict detection ============ */
function conflicts(acts){
 const out=[];const a=[...acts].sort((x,y)=>toMin(x.start)-toMin(y.start));
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
   const [s1,e1]=interval(a[i]),[s2,e2]=interval(a[j]);
   if(Math.max(s1,s2)<Math.min(e1,e2)&&a[i].icon!=='bed'&&a[j].icon!=='bed'){out.push([a[i],a[j]]);}
 }
 return out;
}
function freeSlots(acts){
 const busy=acts.filter(a=>a.icon!=='bed').map(interval).sort((x,y)=>x[0]-y[0]);
 const slots=[];let cur=6*60;
 busy.forEach(([s,e])=>{if(s-cur>=30)slots.push([cur,s]);cur=Math.max(cur,e);});
 if(23*60-cur>=30)slots.push([cur,23*60]);
 return slots.slice(0,3);
}

/* ============ Stats ============ */
function dayStats(d,ds){
 ds=ds||dayStr;
 const acts=d.activities||[];const total=acts.length||1;
 const done=acts.filter(a=>a.status==='done').length;
 const skipped=acts.filter(a=>a.status==='skipped').length;
 const missed=acts.filter(a=>isMissedOn(ds,a)).length;
 const adherence=Math.round(done/total*100);
 return {total:acts.length,done,skipped,missed,adherence,focus:d.focusMin||0,screen:d.screenMin||0};
}

/* ---- habit helpers ---- */
function habitBestStreak(hb){
 if(!hb.history)return 0;
 const dates=Object.keys(hb.history).filter(d=>hb.history[d]===true).sort();
 if(!dates.length)return 0;
 let best=1,cur=1;
 for(let i=1;i<dates.length;i++){
   const diffDays=Math.round((new Date(dates[i]+'T00:00')-new Date(dates[i-1]+'T00:00'))/86400000);
   if(diffDays===1){cur++;best=Math.max(best,cur);}else cur=1;
 }
 return Math.max(best,cur);
}
function habitSuccessRate(hb,days){

 let score=0;
 dates.forEach(d=>{const v=hb.history&&hb.history[d];if(v===true)score+=1;else if(v==='partial')score+=.5;});
 return Math.round(score/days*100);
}

 return {done,partial,missed,total:done+partial+missed};

function worstWeekdayFor(hb,weeks){
 weeks=weeks||6;
 const counts=[0,0,0,0,0,0,0],totals=[0,0,0,0,0,0,0];
 for(let i=0;i<weeks*7;i++){const ds=addDays(todayStr(),-i-1);const dw=dowOf(ds);totals[dw]++;if(hb.history&&hb.history[ds]===true)counts[dw]++;}
 let worstIdx=-1,worstRate=1;
 for(let i=0;i<7;i++){if(totals[i]<2)continue;const rate=counts[i]/totals[i];if(rate<worstRate){worstRate=rate;worstIdx=i;}}
 return worstIdx>=0&&worstRate<0.5?{day:DAYNAMES[worstIdx],rate:Math.round(worstRate*100)}:null;
}

function goalStatus(g){
 const p=goalBar(g).p;
 if(p>=100)return 'completed';
 if(g.targetDate&&g.targetDate<todayStr())return 'overdue';
 return 'active';
}
function nextGoalSession(g){
 const tpls=linkedTemplatesFor(g);
 if(!tpls.length)return null;
 const n=nowMin();
 for(let i=0;i<8;i++){
   const ds=addDays(todayStr(),i);

     const label=i===0?'Today':i===1?'Tomorrow':DAYNAMES[dowOf(ds)];
     return `${label}, ${fmt12(t.start)}`;
   }
 }
 return null;
}
function sortGoals(list,mode){
 const arr=[...list];
 const statusRank={overdue:0,active:1,completed:2};
 if(mode==='progress')arr.sort((a,b)=>goalBar(b).p-goalBar(a).p);

 return arr;
}

/* current-time dot that travels along the timeline rail, interpolated by clock time */
function positionNowMarker(){
 const body=document.getElementById('tlBody');if(!body)return;
 const marker=body.querySelector('#tlNow');if(!marker)return;
 if(tlMode!=='timeline'||dayStr!==todayStr()){marker.style.display='none';return;}
 const items=[...body.querySelectorAll('.tl-item')];
 const pts=items.map(it=>{
   const mid=it.querySelector('.tl-mid');const actEl=it.querySelector('[data-id]');
   if(!mid||!actEl)return null;
   const a=day.activities.find(x=>x.id===actEl.dataset.id);if(!a)return null;
   return{t:toMin(a.start),x:it.offsetLeft+mid.offsetLeft+11,y:it.offsetTop+mid.offsetTop+11.5};
 }).filter(Boolean).sort((p,q)=>p.t-q.t);
 if(!pts.length){marker.style.display='none';return;}
 const n=nowMin();let x,y;
 if(n<=pts[0].t){x=pts[0].x;y=pts[0].y;}
 else if(n>=pts[pts.length-1].t){x=pts[pts.length-1].x;y=pts[pts.length-1].y;}
 else{
   let p0=pts[0],p1=pts[pts.length-1];
   for(let i=0;i<pts.length-1;i++){if(n>=pts[i].t&&n<=pts[i+1].t){p0=pts[i];p1=pts[i+1];break;}}
   const f=(n-p0.t)/Math.max(1,(p1.t-p0.t));
   x=p0.x+(p1.x-p0.x)*f;y=p0.y+(p1.y-p0.y)*f;
 }
 marker.style.display='block';
 marker.style.transform=`translate(${x}px,${y}px)`;
}

function donutHTML(completed,inProgress,overdue,total,avgProgress){
 const r=70,circ=2*Math.PI*r;
 const segs=[{n:completed,color:'#22c55e'},{n:inProgress,color:'#3b82f6'},{n:overdue,color:'#f59e0b'}];
 let offset=0;
 const circles=segs.map(s=>{
   const frac=total?s.n/total:0,len=frac*circ,dashoffset=-offset;
   offset+=len;
   return len>0?`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${dashoffset}"/>`:'';
 }).join('');
 return `<div class="donut-wrap">
  <svg viewBox="0 0 180 180" width="170" height="170" style="transform:rotate(-90deg)">
   <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--line)" stroke-width="16"/>
   ${circles}
  </svg>
  <div class="donut-center"><b>${avgProgress}%</b><span>Overall Progress</span></div>
 </div>
 <div class="donut-legend">
  <div class="dl-row"><span class="dot" style="background:#22c55e"></span>Completed<b>${completed} (${total?Math.round(completed/total*100):0}%)</b></div>
  <div class="dl-row"><span class="dot" style="background:#3b82f6"></span>In Progress<b>${inProgress} (${total?Math.round(inProgress/total*100):0}%)</b></div>
  <div class="dl-row"><span class="dot" style="background:#f59e0b"></span>Overdue<b>${overdue} (${total?Math.round(overdue/total*100):0}%)</b></div>
 </div>`;
}

/* ============ VIEW: Work Dashboard ============
   Personal tasks live in pref (synced privately per-account like everything else):
   pref.workProjects   [{id,name,color,icon}]
   pref.workTasks       [{id,title,description,projectId,dueDate,priority,status,progress,
                          recurringId,occurrenceDate,schedule:[{id,date,start,end}],comments:[],history:[],createdAt,completedAt}]
   pref.recurringTasks [{id,title,description,projectId,priority,freq,days,dayOfMonth,time,createdAt}]
   A recurring task is a template; ensureRecurringOccurrences() materializes it into ordinary workTasks (one per
   due date) so each occurrence keeps its own independent status/progress/comments, per the "template → occurrences"
   requirement — never mutate a single task's due date to represent recurrence.
   A workTask can be linked to one or more DayPlan activities (day.activities[].workTaskId) via scheduleTaskToDayPlan();
   the task stays the single source of truth and is never duplicated into a second record.

   Shared/team tasks are NOT part of pref at all — they live on the VPS sync server (teams/shared_tasks/
   shared_task_status/shared_task_comments tables) so every member's completion state is genuinely independent
   and visible to every other member, not just synced copies of one person's data. See the "Team collaboration"
   API layer above (refreshMyTeams, fetchTeamState, createSharedTaskRemote, setSharedTaskStatusRemote, etc.) and
   teamsModal()/teamTaskDetailModal(). Recurring + team-shared is not combined yet — recurring stays personal-only.
*/
let workUI={tab:'all',q:'',filterView:null};
const WORK_TABS=[['all','All'],['today','Due Today'],['upcoming','Upcoming'],['overdue','Overdue'],['inprogress','In Progress'],['completed','Completed']];
function taskProject(t){return (pref.workProjects||[]).find(p=>p.id===t.projectId)||null;}
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function slug(s){return String(s).toLowerCase().replace(/\s+/g,'-');}
function dateLabelShort(ds){const d=new Date(ds+'T00:00');return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);}
function isOverdue(t){return !!(t.dueDate&&t.dueDate<todayStr()&&t.status!=='Completed');}
function pushTaskHistory(t,text){t.history=t.history||[];t.history.push({ts:Date.now(),text});}
function setTaskStatus(t,status){
 if(status==='Completed'){
   if(t.status!=='Completed')t._prevProgress=t.progress||0; // remember it so reopening doesn't strand progress at 100
   t.progress=100;t.completedAt=todayStr();
 }else{
   if(t.status==='Completed'){t.progress=t._prevProgress!=null?t._prevProgress:t.progress;delete t._prevProgress;}
   delete t.completedAt;
 }
 t.status=status;pushTaskHistory(t,'Status → '+status);
}

 q('#cf-yes').onclick=()=>{closeModal();onConfirm();};

/* if a recurring occurrence is explicitly deleted, remember its date on the template so the next
   lazy-generation pass doesn't silently recreate it */
function skipOccurrenceIfDeleted(t){
 if(!t.recurringId||!t.occurrenceDate)return;
 const rt=(pref.recurringTasks||[]).find(x=>x.id===t.recurringId);if(!rt)return;
 rt.skipDates=rt.skipDates||[];
 if(!rt.skipDates.includes(t.occurrenceDate))rt.skipDates.push(t.occurrenceDate);
}

 const task=findSharedTask(teamId,taskId);
 const cur=task&&account?(task.statuses[account.email]||'Not Started'):'Not Started';

}

/* materialize this week's/today's/this month's occurrences from recurring templates, without duplicating existing ones */
function dateStrOf(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* dates this week (or this month) matching the template, excluding anything dated before the series
   existed — but if that filter empties out the whole window (e.g. series created on a Saturday for a
   "every Friday" task, so this week's Friday already passed), look ahead to the next window instead of
   surfacing nothing at all until next week rolls over naturally */
function recurringWindowDates(rt,today,createdDateStr){
 if(rt.freq==='daily')return[today];
 if(rt.freq==='monthly'){
   const dom=Math.min(rt.dayOfMonth||1,28);
   const mk=ds=>{const [y,m]=ds.split('-').map(Number);return `${y}-${String(m).padStart(2,'0')}-${String(dom).padStart(2,'0')}`;};
   let candidate=mk(today);
   if(candidate<createdDateStr){const [y,m]=today.split('-').map(Number);const nm=new Date(Date.UTC(y,m,1));candidate=`${nm.getUTCFullYear()}-${String(nm.getUTCMonth()+1).padStart(2,'0')}-${String(dom).padStart(2,'0')}`;}
   return[candidate];
 }
 let candidates=weekDates(today).filter(ds=>(rt.days||[]).includes(dowOf(ds))&&ds>=createdDateStr);
 if(!candidates.length){
   const nextWeekStart=addDays(weekDates(today)[0],7);
   candidates=[...Array(7)].map((_,i)=>addDays(nextWeekStart,i)).filter(ds=>(rt.days||[]).includes(dowOf(ds))&&ds>=createdDateStr);
 }
 return candidates;
}
function ensureRecurringOccurrences(){
 pref.recurringTasks=pref.recurringTasks||[];pref.workTasks=pref.workTasks||[];
 let changed=false;
 pref.recurringTasks.forEach(rt=>{
   const createdDateStr=rt.createdAt?dateStrOf(rt.createdAt):'0000-00-00';
   const dates=recurringWindowDates(rt,todayStr(),createdDateStr);
   dates.forEach(ds=>{
     if((rt.skipDates||[]).includes(ds))return;
     if(pref.workTasks.some(t=>t.recurringId===rt.id&&t.occurrenceDate===ds))return;
     pref.workTasks.push({id:id(),title:rt.title,description:rt.description||'',projectId:rt.projectId||'',
       dueDate:ds,priority:rt.priority||'Medium',status:'Not Started',progress:0,
       recurringId:rt.id,occurrenceDate:ds,schedule:[],comments:[],
       history:[{ts:Date.now(),text:'Occurrence created'}],createdAt:Date.now()});
     changed=true;
   });
 });
 if(changed)queueSave();
}

/* schedules a work session for a task into a given DayPlan day — the activity links back via workTaskId so the
   task is never duplicated, only referenced from Today */
async function scheduleTaskToDayPlan(task,date,start,end){
 const proj=taskProject(task);
 const entry={id:id(),workTaskId:task.id,title:task.title,icon:'work',color:proj?proj.color:'#6366f1',start,end,status:'pending'};
 if(date===dayStr){
   day.activities=day.activities||[];day.activities.push(entry);await DB.set(dayKey(dayStr),day);
 }else{
   let d=await DB.get(dayKey(date));
   if(!d)d={planned:false,activities:generateActivities(date),priorities:[],focusMin:0,screenMin:0,review:null};
   d.activities=d.activities||[];d.activities.push(entry);await DB.set(dayKey(date),d);
 }
 task.schedule=task.schedule||[];task.schedule.push({id:entry.id,date,start,end});
 pushTaskHistory(task,'Scheduled '+dateLabel(date)+', '+fmt12(start)+'–'+fmt12(end));
}

 q('#wt-save').onclick=async()=>{
   const title=q('#wt-title').value.trim();
   if(!title){toast('Add a task name');return;}
   const due=q('#wt-due').value;
   if(!due){toast('Pick a due date');return;}
   const description=q('#wt-desc').value.trim();
   const priority=q('#wt-pri').value;
   const dueTime=q('#wt-duetime').value||null;

   if(shared){
     if(!syncEnabled()){toast('Log in from Settings to share tasks with a team');return;}
     const teamSel=q('#wt-team');
     const teamId=teamSel?teamSel.value:'';
     if(!teamId){toast('Pick a team, or create/join one first');return;}
     const projId=q('#wt-proj').value;
     const proj=projId?(pref.workProjects||[]).find(p=>p.id===projId):null;
     const projectName=proj?proj.name:'';
     try{
       if(recurOn&&recurSw){
         const freq=q('#wt-recurFreq').value;
         const days=[...q('#wt-recurDays').querySelectorAll('.on')].map(b=>+b.dataset.rd);
         const schedStart=schedOn?q('#wt-sStart').value:null;

         await createSharedRecurringTaskRemote(teamId,{title,description,projectName,priority,freq,days,dayOfMonth:num(q('#wt-recurDom').value)||1,dueTime,schedStart,schedEnd});
         await ensureTeamRecurringSchedules();
         closeModal();render();toast('Recurring shared task created');
       }else{
         const r=await createSharedTaskRemote(teamId,{title,description,projectName,dueDate:due,dueTime,priority});
         if(schedOn){
           const start=q('#wt-sStart').value,end=q('#wt-sEnd').value;
           if(start&&end)await scheduleTaskToDayPlan({id:r.id,title},due,start,end);
         }
         closeModal();render();toast('Shared task created');

   }

   const obj={
     ...base,id:base.id||id(),title,description,

     priority,status:q('#wt-status').value,

     createdAt:base.createdAt||Date.now()

   const isNew=!tid;

   else pref.workTasks.push(obj);
   pushTaskHistory(obj,isNew?'Task created':'Task updated');

   if(recurOn&&recurSw){
     const freq=q('#wt-recurFreq').value;
     const days=[...q('#wt-recurDays').querySelectorAll('.on')].map(b=>+b.dataset.rd);

       freq,days,dayOfMonth:num(q('#wt-recurDom').value)||1,time:dueTime||'09:00',
       shared:false,assignees:[],createdAt:Date.now()};
     pref.recurringTasks=pref.recurringTasks||[];pref.recurringTasks.push(rtObj);
     obj.recurringId=rtObj.id;obj.occurrenceDate=obj.dueDate;
   }

   if(schedOn){
     const date=recurOn?obj.dueDate:(q('#wt-sDate').value||obj.dueDate),start=q('#wt-sStart').value,end=q('#wt-sEnd').value;
     if(date&&start&&end)await scheduleTaskToDayPlan(obj,date,start,end);

/* ============ Focus Mode ============ */
function startFocus(aid){
 const acts=(day.activities||[]).filter(a=>a.status==='pending').sort((a,b)=>toMin(a.start)-toMin(b.start));
 if(!aid){
   if(!acts.length){toast('No pending activities to focus on');return;}
   // pick current/next
   const n=nowMin();aid=(acts.find(a=>{const[s,e]=interval(a);return n>=s&&n<e;})||acts[0]).id;
 }
 const a=day.activities.find(x=>x.id===aid);const mins=(pref.focusLen||60);
 focusState={aid,total:mins*60,left:mins*60,running:true};
 renderFocus();document.getElementById('focusScreen').classList.add('show');
 clearInterval(focusTimer);focusTimer=setInterval(tickFocus,1000);
}
function tickFocus(){if(!focusState)return;if(focusState.running){focusState.left--;if(focusState.left<=0){completeFocus();return;}renderFocus();}}
function renderFocus(){
 const scr=document.getElementById('focusScreen');const a=day.activities.find(x=>x.id===focusState.aid);
 const acts=[...day.activities].sort((x,y)=>toMin(x.start)-toMin(y.start));const idx=acts.findIndex(x=>x.id===a.id);const next=acts[idx+1];
 const mm=String(Math.floor(focusState.left/60)).padStart(2,'0'),ss=String(focusState.left%60).padStart(2,'0');
 const pct=1-focusState.left/focusState.total;const C=2*Math.PI*112;
 scr.innerHTML=`<div class="ftask">Now focusing</div><div class="ftitle">${esc(a.title)}</div>
  <div class="ftimer"><svg width="250" height="250"><circle cx="125" cy="125" r="112" stroke="rgba(255,255,255,.12)" stroke-width="10" fill="none"/><circle cx="125" cy="125" r="112" stroke="#22c55e" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><div class="fnum">${mm}:${ss}</div></div>
  <div class="fnext">${next?'Next: '+esc(next.title)+' · '+fmt12(next.start):'Last activity of the day'}</div>
  <div class="fctrls"><button class="btn" id="fPause">${svg(focusState.running?'pause':'play','16')} ${focusState.running?'Pause':'Resume'}</button><button class="btn" id="fSkip">Skip</button><button class="btn primary" id="fDone">${svg('check',16)} Complete</button><button class="btn" id="fExit">Exit</button></div>`;
 scr.querySelector('#fPause').onclick=()=>{focusState.running=!focusState.running;renderFocus();};
 scr.querySelector('#fSkip').onclick=()=>{a.status='skipped';exitFocus();queueSave();render();};
 scr.querySelector('#fDone').onclick=completeFocus;
 scr.querySelector('#fExit').onclick=()=>{addFocusTime();exitFocus();};
}
function addFocusTime(){if(!focusState)return;const spent=Math.round((focusState.total-focusState.left)/60);day.focusMin=(day.focusMin||0)+Math.max(0,spent);}
function completeFocus(){const a=day.activities.find(x=>x.id===focusState.aid);a.status='done';syncGoalFromActivity(a);addFocusTime();exitFocus();queueSave();render();toast('Nice — activity complete ✅');}
function exitFocus(){clearInterval(focusTimer);focusState=null;document.getElementById('focusScreen').classList.remove('show');}

 };

  <div class="field"><label>Short description (optional)</label><input id="h-desc" value="${esc(h.desc||'')}" placeholder="e.g. Stay hydrated"></div>
  <div class="field"><label>Daily goal (optional)</label><input id="h-goaltext" value="${esc(h.goalText||'')}" placeholder="e.g. Read 30 minutes"></div>
  <div class="row2"><div class="field"><label>Category</label><select id="h-cat">${HABIT_CATEGORIES.map(c=>`<option value="${c}" ${h.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Link to goal (optional)</label><select id="h-goal">${goalOpts}</select></div></div>
  <div class="field"><label>Icon</label>${iconPicker(h.icon)}</div>
  <div class="field"><label>Colour</label><div class="chips">${ACT_COLORS.map(c=>`<button type="button" class="cpick" data-c="${c}" style="width:30px;height:30px;border-radius:8px;background:${c};border:2px solid ${c===h.color?'var(--ink)':'transparent'}"></button>`).join('')}</div></div>`,
  `${hid?'<button class="danger-link" id="h-del" style="margin-right:auto;background:none;border:none;color:var(--red);font-weight:700;cursor:pointer;font-family:inherit">Delete</button>':''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="h-save">Save</button>`);
 wireIconPicker();let hcolor=h.color||ACT_COLORS[1];overlay.querySelectorAll('.cpick').forEach(b=>b.onclick=()=>{hcolor=b.dataset.c;overlay.querySelectorAll('.cpick').forEach(x=>x.style.borderColor='transparent');b.style.borderColor='var(--ink)';});
 q('#h-save').onclick=()=>{const name=q('#h-name').value.trim();if(!name){toast('Name the habit');return;}const goalId=q('#h-goal').value||null;const fields={name,icon:pickedIcon(),goalId,color:hcolor,desc:q('#h-desc').value.trim(),goalText:q('#h-goaltext').value.trim(),category:q('#h-cat').value};pref.habits=pref.habits||[];if(hid)pref.habits=pref.habits.map(x=>x.id===hid?{...x,...fields}:x);else pref.habits.push({id:id(),history:{},...fields});queueSave();render();closeModal();};
 const del=q('#h-del');if(del)del.onclick=()=>{pref.habits=pref.habits.filter(x=>x.id!==hid);queueSave();render();closeModal();};
}
function screenModal(){
 openModal('Log screen time',`<div class="field"><label>Phone/screen time today (minutes)</label><input id="sc" inputmode="numeric" value="${day.screenMin||0}"></div><div class="sub">Target: ${(pref.phoneTarget/60).toFixed(0)}h/day.</div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="scSave">Save</button>`);
 q('#scSave').onclick=()=>{day.screenMin=Math.round(num(q('#sc').value));queueSave();render();closeModal();};
}

/* ============ Notifications (while open) ============ */
setInterval(()=>{
 if(!pref||!pref.notify||dayStr!==todayStr()||!window.Notification||Notification.permission!=='granted')return;
 const n=nowMin();(day.activities||[]).forEach(a=>{if(a.status!=='pending')return;const s=toMin(a.start);if(s-n===5&&!a._notified){a._notified=true;new Notification('Starting soon: '+a.title,{body:fmt12(a.start)+' – '+fmt12(a.end)});}});
},30000);

setInterval(()=>{positionNowMarker();updateNowActive();},30000);
window.addEventListener('resize',()=>positionNowMarker());

/* ============ Seed & init ============ */
function defaultTemplates(){
 const T=(title,icon,color,start,end,recur,days)=>({id:id(),title,icon,color,start,end,recur,days:days||[],goalId:null});
 return [
  T('Wake Up & Freshen Up','sun','#f59e0b','07:00','07:30','daily'),
  T('Exercise / Workout','run','#22c55e','07:30','08:30','daily'),
  T('Book Reading','book','#3b82f6','08:30','09:30','daily'),
  T('Goal Setting & Learning','goal','#8b5cf6','09:30','10:30','daily'),
  T('Work (Deep Work)','work','#f97316','10:30','16:00','weekday'),
  T('Break / Rest','coffee','#14b8a6','16:00','17:00','daily'),
  T('Personal Time / Refresh','smile','#f59e0b','17:00','18:00','daily'),
  T('Class / Study','grad','#6366f1','18:00','19:00','daily'),
  T('Walking','walk','#22c55e','19:00','20:00','daily'),
  T('Family / Calls','phone','#3b82f6','20:00','21:00','daily'),
  T('English Class','en','#ec4899','20:00','21:30','weekly',[2]),
  T('English Class (Daily)','en','#ec4899','21:00','21:30','daily'),
  T('English Learning (Videos)','play','#ef4444','21:30','22:30','daily'),
  T('Wind Down & Prepare for Sleep','moon','#8b5cf6','22:30','23:00','daily'),
  T('Sleep','bed','#6366f1','23:00','07:00','daily'),
 ];
}
async function init(){
 buildNav();
 pref=await DB.get(PREF);
 if(!pref){
   pref={name:'',dark:false,wakeTime:'07:00',sleepHours:8,phoneTarget:120,focusLen:60,focusGoalH:4,noPhoneSleep:true,notify:false,
     templates:defaultTemplates(),
     goals:[
       {id:id(),name:'Read 20 Books',current:0,target:20,unit:'books',color:'#3b82f6',icon:'book'},
       {id:id(),name:'Learn New Skills',current:0,target:100,unit:'',color:'#8b5cf6',icon:'brain'},
       {id:id(),name:'Fitness 5 Days/Week',current:0,target:100,unit:'',color:'#22c55e',icon:'dumbbell'},
       {id:id(),name:'Save ₹50,000',current:0,target:50000,unit:'',color:'#f59e0b',icon:'goal'},
     ],
     habits:[
       {id:id(),name:'Exercise',icon:'run',history:{}},
       {id:id(),name:'Read',icon:'book',history:{}},
       {id:id(),name:'English Learning',icon:'en',history:{}},
       {id:id(),name:'No Phone before Sleep',icon:'moon',history:{}},
       {id:id(),name:'Drink 2L Water',icon:'water',history:{}},
     ]};
   const workSeed=defaultWorkSeed();
   pref.workProjects=workSeed.projects;pref.workTasks=workSeed.tasks;pref.recurringTasks=workSeed.recurring;
   // real first day — nothing pre-filled or auto-completed; every activity starts pending until the user acts on it
   const today=todayStr();
   dayStr=today;
   day={planned:false,activities:generateActivities(today),priorities:[],focusMin:0,screenMin:0,review:null};
   await DB.set(dayKey(today),day);
   await DB.set(PREF,pref);
 }else{
   dayStr=pref.lastDay&&pref.lastDay>=addDays(todayStr(),-30)?pref.lastDay:todayStr();
   day=await DB.get(dayKey(dayStr));
   if(!day)day={planned:false,activities:generateActivities(dayStr),priorities:[],focusMin:0,screenMin:0,review:null};
 }
 applyDark();
 setView('today');
 account=await DB.get(ACCOUNT_KEY);
 if(syncEnabled())syncNow();
}
init();
</script>
<script src="desktop.js"></script>
