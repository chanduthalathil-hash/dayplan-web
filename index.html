<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DayPlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f7f6;--card:#fff;--ink:#0f172a;--ink-2:#5b6b80;--ink-3:#94a3b8;--line:#edf1f4;--line-2:#e2e8f0;
 --green:#22c55e;--green-600:#16a34a;--green-tint:#e9f9ef;--blue:#3b82f6;--purple:#8b5cf6;--amber:#f59e0b;--red:#ef4444;--pink:#ec4899;--teal:#14b8a6;--indigo:#6366f1;
 --radius:18px;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--shadow-pop:0 16px 46px rgba(15,23,42,.20);
}
body.dark{
 --bg:#0a1120;--card:#121a2b;--ink:#e7ecf3;--ink-2:#93a1b5;--ink-3:#6b7a90;--line:#222e44;--line-2:#2c3a52;--green-tint:#12321f;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.app{display:flex;min-height:100vh;gap:22px;padding:22px;max-width:1500px;margin:0 auto}
/* sidebar */
.sidebar{width:238px;flex:0 0 238px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:22px;height:calc(100vh - 44px);overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#22c55e,#16a34a);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.brand h1{font-size:16px;font-weight:800;margin:0}.brand span{font-size:11px;color:var(--ink-3);font-weight:500}
nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink-2);font-weight:600;font-size:13.5px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:.14s}
.nav-item svg{width:18px;height:18px;flex:0 0 18px}
.nav-item:hover{background:var(--bg);color:var(--ink)}
.nav-item.active{background:var(--green-tint);color:var(--green-600)}
.side-card{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px;text-align:center}
.ring{width:104px;height:104px;border-radius:50%;margin:6px auto 10px;position:relative;display:grid;place-items:center}
.ring::after{content:"";position:absolute;inset:11px;background:var(--card);border-radius:50%}
.ring .rn{position:relative;z-index:1;font-size:24px;font-weight:800}
.side-title{font-weight:700;font-size:13.5px}
.side-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.focus-badge{width:74px;height:74px;border-radius:50%;border:3px solid var(--green-tint);display:grid;place-items:center;margin:8px auto 10px}
.focus-badge b{font-size:20px;font-weight:800}.focus-badge small{font-size:10px;color:var(--ink-3);display:block}
.btn{font-family:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--green-600);border-color:var(--green-600);color:#fff}.btn.primary:hover{background:#15803d}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.6;cursor:default}
.btn svg{width:16px;height:16px}
.toggle{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:600;font-size:13.5px}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;transition:.2s;flex:0 0 42px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet h2{font-size:24px;font-weight:800;margin:0}.greet p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--card);border-radius:11px;padding:4px}
.datenav button{border:none;background:none;cursor:pointer;color:var(--ink-2);width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.datenav button:hover{background:var(--bg)}
.datenav .dl{font-weight:700;font-size:13.5px;padding:0 8px;min-width:118px;text-align:center}
.icon-btn{position:relative;width:42px;height:42px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--bg)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:15.5px;font-weight:700}
.sub{font-size:12px;color:var(--ink-3);margin:-6px 0 12px}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;gap:13px;align-items:flex-start}
.stat .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px}
.stat .sl{font-size:12px;color:var(--ink-2);font-weight:600}
.stat .sv{font-size:21px;font-weight:800;margin:3px 0 2px}
.stat .sm{font-size:11.5px;color:var(--ink-3);font-weight:500}
/* layout */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:none;background:none;font-family:inherit;font-weight:600;font-size:12.5px;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.tabs button.on{background:var(--card);color:var(--green-600);box-shadow:var(--shadow)}
/* timeline */
.tl-item{display:grid;grid-template-columns:74px 1fr;gap:12px;position:relative}
.tl-time{text-align:right;font-size:12px;font-weight:700;color:var(--ink-2);padding-top:16px;white-space:pre-line;line-height:1.3}
.tl-mid{position:relative;padding-left:22px;padding-bottom:12px}
.tl-mid::before{content:"";position:absolute;left:5px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--dotc,var(--green));box-shadow:0 0 0 3px var(--card)}
.tl-mid::after{content:"";position:absolute;left:10px;top:16px;bottom:-6px;width:2px;background:var(--line-2)}
.tl-item:last-child .tl-mid::after{display:none}
#tlBody{position:relative}
.tl-now{position:absolute;top:0;left:0;width:0;height:0;pointer-events:none;z-index:6;display:none;transition:transform .6s linear}
.tl-now-dot{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px var(--card);position:relative}
.tl-now-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#ef4444;animation:tlPulse 1.8s ease-out infinite}
@keyframes tlPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}
.act{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--card);transition:.25s;position:relative}
.act:hover{border-color:var(--line-2)}
.act.done{opacity:1;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
.act.act-now{border-color:#f59e0b;background:rgba(245,158,11,.10);animation:actBlink 1.6s ease-in-out infinite}
.act.act-now::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:13px 0 0 13px;background:#f59e0b}
.act.act-missed{border-color:#ef4444;background:rgba(239,68,68,.07)}
.act.act-missed::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:13px 0 0 13px;background:#ef4444}
@keyframes actBlink{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.45)}50%{box-shadow:0 0 0 6px rgba(245,158,11,0)}}
.act .aic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px}
.act .atx{flex:1;min-width:0}
.act .an{font-weight:700;font-size:13.5px}
.act.done .an{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.act .at{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.act .ar{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;display:grid;place-items:center;color:transparent;transition:.14s;background:none}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk.skip{background:var(--amber);border-color:var(--amber);color:#fff}
.chk.post{background:var(--blue);border-color:var(--blue);color:#fff}
.dots{border:none;background:none;color:var(--ink-3);cursor:pointer;width:26px;height:26px;border-radius:7px}
.dots:hover{background:var(--bg);color:var(--ink)}
.st-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.st-tag.skipped{background:#fef3e2;color:#b45309}.st-tag.postponed{background:#e9f2ff;color:#2563eb}.st-tag.missed{background:#fee2e2;color:#dc2626}
body.dark .st-tag.skipped{background:#3a2a12}body.dark .st-tag.postponed{background:#16233c}body.dark .st-tag.missed{background:#3a1414}
/* weekly overview */
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:8px}
.week .wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .wbar{width:100%;max-width:26px;background:var(--green-tint);border-radius:7px;display:flex;align-items:flex-end;overflow:hidden;height:100%}
.week .wbar>i{width:100%;background:linear-gradient(180deg,#22c55e,#16a34a);border-radius:7px;transition:height .5s}
.week .wl{font-size:11px;color:var(--ink-3);font-weight:600}.week .wp{font-size:11px;font-weight:700}
.wdh{display:flex;gap:8px;margin-bottom:2px}.wdh span{flex:1;text-align:center;font-size:11px;color:var(--ink-3);font-weight:600}
/* progress rows */
.pr{margin-bottom:13px}.pr:last-child{margin-bottom:0}
.pr-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.pr-top .pv{color:var(--ink-3);font-weight:700;font-size:12px}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
/* upcoming */
.up{display:flex;align-items:center;gap:12px;padding:10px 0}.up+.up{border-top:1px solid var(--line)}
.up .uic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.up .un{font-weight:700;font-size:13px}.up .ut{font-size:11.5px;color:var(--ink-3)}
/* habits */
.hb{display:flex;align-items:center;gap:11px;padding:9px 0}.hb+.hb{border-top:1px solid var(--line)}
.hb .hchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);cursor:pointer;display:grid;place-items:center;color:transparent;flex:0 0 22px}
.hb .hchk.on{background:var(--green);border-color:var(--green);color:#fff}
.hb .hn{font-weight:600;font-size:13.5px;flex:1}
.hstreak{font-size:11px;color:var(--ink-3);font-weight:700}
.wk-dots{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);justify-content:space-between}
.wk-dots .d{text-align:center;flex:1}.wk-dots .dl{font-size:10.5px;color:var(--ink-3);font-weight:700}
.wk-dots .dc{width:22px;height:22px;border-radius:50%;margin:5px auto 0;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent}
.wk-dots .dc.on{background:var(--green);border-color:var(--green);color:#fff}
/* tips */
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tip{display:flex;gap:11px}
.tip .tic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.tip .tt{font-weight:700;font-size:13px}.tip .td{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
/* banner */
.banner{background:linear-gradient(120deg,#e9f9ef,#eafaf1);border:1px solid #c9efd6;border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:16px}
body.dark .banner{background:linear-gradient(120deg,#12321f,#0f2a1a);border-color:#1c4a2e}
.banner .bic{width:46px;height:46px;border-radius:13px;background:var(--card);display:grid;place-items:center;color:var(--green-600);flex:0 0 46px;box-shadow:var(--shadow)}
.banner .bt{font-weight:800;font-size:16px}.banner .bd{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.warn-box{border:1px solid #f6d9a8;background:#fef7ec;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:#92600c}
body.dark .warn-box{background:#2a2110;border-color:#4a3a16;color:#e0b464}
.warn-box b{font-weight:700}
.empty{color:var(--ink-3);font-size:13px;text-align:center;padding:20px 0}
.pri{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.pri .pn{width:24px;height:24px;border-radius:7px;background:var(--green-tint);color:var(--green-600);display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 24px}
/* ---- premium look: soft page wash, airy sidebar, glassy top bar, hero banner ---- */
body{background:radial-gradient(1200px 600px at 100% -10%,rgba(34,197,94,.07),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(99,102,241,.06),transparent 60%),var(--bg);background-attachment:fixed}
.card,.stat{border:1px solid var(--line)}
body.dark .card,body.dark .stat{border-color:#1d2840}
.sidebar{background:transparent;box-shadow:none;border-right:1px solid var(--line);border-radius:0;padding:8px 14px 14px 4px}
.brand{padding:4px 8px 22px}
.brand .logo{width:44px;height:44px;border-radius:13px}
.brand h1{font-size:21px;letter-spacing:-.3px}.brand span{font-size:11.5px}
.nav-item{padding:10px 14px;font-size:14.5px;font-weight:500;gap:14px;border-radius:12px}
.nav-item svg{width:19px;height:19px;flex:0 0 19px}
.nav-item:hover{background:var(--card)}
.nav-item.active{background:linear-gradient(90deg,rgba(34,197,94,.16),rgba(34,197,94,.08));color:var(--green-600);font-weight:700}
body.dark .nav-item.active{color:#4ade80}
.side-quote{margin-top:auto;border-radius:16px;padding:16px 16px 18px;background:linear-gradient(150deg,#ecfdf3,#dcfce7 60%,#bbf7d0);position:relative;overflow:hidden;min-height:112px;color:#14532d;flex:0 0 auto}
.side-quote b{display:block;font-size:13px;font-weight:700;position:relative;z-index:1;max-width:120px}.side-quote span{display:block;font-size:11.5px;opacity:.8;position:relative;z-index:1;max-width:120px;margin-top:3px}
.side-quote svg{position:absolute;right:-6px;bottom:-8px;width:88px;height:88px;color:#16a34a;opacity:.8}
body.dark .side-quote{background:linear-gradient(150deg,#10261a,#12321f);color:#bbf7d0}
.topbar{align-items:center}
.top-search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-2);border-radius:13px;padding:0 10px 0 14px;height:44px;color:var(--ink-3);cursor:pointer;font-family:inherit;font-size:13.5px;box-shadow:var(--shadow);transition:.14s;text-align:left}
.top-search:hover{border-color:var(--green)}
.top-search .kbd{margin-left:auto;font-size:11px;font-weight:700;border:1px solid var(--line-2);border-radius:7px;padding:3px 7px;color:var(--ink-3)}
.datenav{height:44px;border-radius:13px;box-shadow:var(--shadow);padding:0 6px}
.icon-btn{height:44px;width:44px;border-radius:13px;box-shadow:var(--shadow)}
.avatar-chip{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px 0 6px;border-radius:13px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-weight:700;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow);font-family:inherit}
.avatar-chip i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#6366f1);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
.topbar{flex-wrap:nowrap}
.topbar .top-actions{flex-wrap:nowrap}
.page-head{margin-bottom:-4px}
body.own-head .page-head{display:none}
.sidebar{scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:200px;padding:30px 32px 26px;margin-bottom:20px;color:#fff;background:#3b4a6b url("assets/banner.jpg") center 58%/cover no-repeat;box-shadow:0 10px 30px rgba(15,23,42,.14);display:flex;flex-direction:column;justify-content:center}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,23,42,.55) 0%,rgba(15,23,42,.25) 45%,rgba(15,23,42,0) 70%)}
.hero>*{position:relative}
.hero h2{margin:0;font-size:34px;font-weight:800;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(0,0,0,.25);max-width:70%}
.hero .hq{margin:8px 0 18px;font-size:16px;font-weight:500;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.3);max-width:62%}
.hero-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);color:#fff;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.hero-pill:hover{background:rgba(255,255,255,.32)}
.hero-pill.plan{background:var(--green-600);border-color:var(--green-600)}
.hero-pill.plan:hover{background:#15803d}
.hero .hdate{position:absolute;top:22px;right:26px;text-align:right;font-size:13.5px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.hero .hdate small{display:block;font-weight:500;font-size:12px;margin-top:8px;opacity:.95;max-width:170px;margin-left:auto;line-height:1.35}
/* stat tiles */
.stat{padding:18px;align-items:center;gap:14px}
.stat .si{width:46px;height:46px;flex:0 0 46px;border-radius:14px}
.stat .sl{font-size:13px;color:var(--ink);font-weight:700}
.stat .sv{font-size:24px;letter-spacing:-.4px}
.stat .sx{flex:1;min-width:0}
.ring-sm{width:76px;height:76px;border-radius:50%;flex:0 0 76px;display:grid;place-items:center;position:relative}
.ring-sm::after{content:"";position:absolute;inset:8px;background:var(--card);border-radius:50%}
.ring-sm b{position:relative;z-index:1;font-size:18px;font-weight:800}
.hdots{display:flex;gap:7px;margin:8px 0 6px;flex-wrap:wrap}.hdots i{width:11px;height:11px;border-radius:50%;background:var(--line-2)}.hdots i.on{background:var(--green)}
.delta{font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;white-space:nowrap}
.delta.up{background:#fee2e2;color:#dc2626}.delta.down{background:var(--green-tint);color:var(--green-600)}
body.dark .delta.up{background:#3a1414}
/* timeline cards tinted by their activity's colour */
.act{padding:12px 14px;border-radius:14px}
.act:hover{box-shadow:var(--shadow)}
.act.done{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.10)}
.act .aic{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:var(--card)!important;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.act .an{font-size:14px}
.act .at{font-size:12px}
.playb{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:.14s;padding:0}
.playb:hover{border-color:var(--green);color:var(--green-600)}
.chk{width:30px;height:30px}
.tl-item{grid-template-columns:64px 1fr}
/* right column */
.focus-card{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--card) 45%,#eef8f1)}
body.dark .focus-card{background:linear-gradient(120deg,var(--card) 45%,#12321f)}
.focus-card .fc-art{position:absolute;right:-14px;bottom:-22px;width:150px;height:150px;color:#22c55e;opacity:.18}
.focus-card h3{display:flex;align-items:center;gap:9px;margin:0;font-size:17px;font-weight:800;position:relative}
.focus-card h3 span{color:var(--blue);display:grid}
.focus-card p{margin:5px 0 14px;color:var(--ink-2);font-size:12.5px;position:relative}
.focus-card .btn{position:relative;padding:11px 20px;font-size:14px}
.focus-card .fstat{position:relative;font-size:11.5px;color:var(--ink-3);margin-top:10px;font-weight:600}
.view-all{font-size:12.5px;color:var(--ink-2);font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;padding:0}
.view-all:hover{color:var(--green-600)}
.in-pill{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:4px 9px;border-radius:8px;white-space:nowrap}
.in-pill.now{background:#fef3c7;color:#b45309;border-color:#fde68a}
body.dark .in-pill.now{background:#3a2a12;border-color:#4a3a16}
.gp{display:flex;gap:12px;align-items:center;margin-bottom:14px}.gp:last-child{margin-bottom:0}
.gp .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.gp .pr{flex:1;margin:0;min-width:0}
@media (max-width:1180px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
 .sidebar{border-right:none;border-bottom:1px solid var(--line)}
 .side-quote{display:none}
 .topbar{flex-wrap:wrap}
 .top-search{order:3;flex:1 1 100%;max-width:none}
 .hero{min-height:170px;padding:22px 20px}
 .hero h2{font-size:24px;max-width:none}.hero .hq{font-size:13.5px;max-width:none}
 .hero .hdate{display:none}
 .avatar-chip span{display:none}
}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:60;padding:20px;opacity:0;pointer-events:none;transition:.18s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-pop);width:100%;max-width:520px;max-height:90vh;overflow:auto;transform:translateY(8px) scale(.98);transition:.18s}
.overlay.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.modal-head h3{margin:0;font-size:17px;font-weight:800}
.modal-body{padding:18px 20px}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);outline:none}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.close-x{background:none;border:none;cursor:pointer;color:var(--ink-3);width:34px;height:34px;border-radius:9px}.close-x:hover{background:var(--bg);color:var(--ink)}
.icon-pick{display:flex;flex-wrap:wrap;gap:7px}
.icon-pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.icon-pick button.on{border-color:var(--green);color:var(--green-600);background:var(--green-tint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--bg);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--green-tint);border-color:var(--green);color:var(--green-600)}
.menu{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;z-index:70;min-width:160px}
.menu button{width:100%;text-align:left;border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;padding:8px 11px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:9px}
.menu button:hover{background:var(--bg)}.menu button.dngr{color:var(--red)}
/* focus overlay */
.focus-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0b1220,#0f2a1a);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;color:#e7ecf3;text-align:center;padding:24px}
.focus-screen.show{display:flex}
.focus-screen .ftask{font-size:13px;color:#93a1b5;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.focus-screen .ftitle{font-size:30px;font-weight:800;margin:8px 0 26px}
.ftimer{width:250px;height:250px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:26px}
.ftimer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ftimer .fnum{font-size:52px;font-weight:800;letter-spacing:-1px}
.fnext{color:#93a1b5;font-size:13px;margin-bottom:26px}
.fctrls{display:flex;gap:12px}
.fctrls .btn{padding:12px 20px;font-size:14px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#e7ecf3}
.fctrls .btn.primary{background:var(--green-600);border-color:var(--green-600);color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:var(--shadow-pop)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- goals dashboard ---- */
.goals-grid{display:grid;grid-template-columns:250px 1fr 300px;gap:20px;align-items:start}
.selectlike{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);cursor:pointer;outline:none}
.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);border:none;background:none;width:100%;text-align:left;font-family:inherit}
.cat-row:hover{background:var(--bg)}
.cat-row.on{background:var(--green-tint);color:var(--green-600)}
.cat-row .ci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 28px}
.cat-row .cn{flex:1}
.cat-row .cc{font-weight:700;font-size:12px;color:var(--ink-3)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.badge-item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.badge-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center}
.badge-ic.locked{background:var(--bg);color:var(--ink-3)}
.badge-label{font-size:10px;font-weight:700;color:var(--ink-2);line-height:1.25}
.badge-item.locked .badge-label{color:var(--ink-3)}
.goal-card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:.15s}
.goal-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.goal-card.is-completed{opacity:.8}
.goal-card.is-overdue{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.035)}
.gc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.gc-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:0 0 46px}
.gc-title{font-weight:800;font-size:15px}
.gc-meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.gc-pct{font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--green-tint);color:var(--green-600);white-space:nowrap}
.gc-count{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.gc-milestone{font-size:12px;color:var(--ink-2);margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:10px;display:flex;align-items:center;gap:7px}
.gc-chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gc-chip{flex:1;min-width:135px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.gc-chip .ci{width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;flex:0 0 26px;color:var(--ink-2)}
.gc-chip .cl{font-size:10.5px;color:var(--ink-3);font-weight:600}
.gc-chip b{display:block;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-foot{display:flex;align-items:center;gap:12px;margin-top:13px}
.gc-streak{display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:13px;color:var(--amber)}
.gc-streak small{font-size:9.5px;font-weight:700;color:var(--ink-3)}
.donut-wrap{position:relative;width:170px;height:170px;margin:6px auto}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:25px;font-weight:800}
.donut-center span{font-size:10.5px;color:var(--ink-3);font-weight:600}
.donut-legend{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.donut-legend .dl-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
.donut-legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.donut-legend .dl-row b{margin-left:auto;color:var(--ink-3);font-weight:700;font-size:11.5px}
.mini-goal{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.mini-goal:last-child{margin-bottom:0}
.mini-goal .mi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:0 0 28px}
.mini-goal .mg-body{flex:1;min-width:0}
.mini-goal .mg-top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;margin-bottom:4px;gap:8px}
.mini-goal .mg-top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-card{background:linear-gradient(135deg,var(--green-tint),transparent);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.quote-card .qmark{font-size:26px;color:var(--green-600);opacity:.55;line-height:1;font-weight:800}
.quote-card p{font-weight:700;font-size:14px;margin:6px 0 0;color:var(--ink);line-height:1.4}
.mile-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mile-row:last-child{border-bottom:none;padding-bottom:0}
.mile-row .mi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 26px}
.mile-row .mn{flex:1;font-size:12.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mile-row .md{font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap}
/* ---- habits dashboard ---- */
.habits-grid{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.stats6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:12px;color:var(--ink-3);pointer-events:none}
.searchbox input{font-family:inherit;font-size:12.5px;font-weight:600;padding:9px 12px 9px 34px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);outline:none;width:190px;max-width:100%}
.searchbox input:focus{border-color:var(--green)}
.habit-card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;transition:.15s}
.habit-card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.hc-top{display:flex;align-items:flex-start;gap:13px}
.hc-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:0 0 48px}
.hc-name{font-weight:800;font-size:15px}
.hc-desc{font-size:12px;color:var(--ink-3);margin-top:1px}
.hc-streak{font-size:12px;font-weight:700;color:var(--amber);margin-top:7px}
.hc-mid{flex:0 0 190px}
.hc-mid .lbl{font-size:10.5px;color:var(--ink-3);font-weight:700;margin-bottom:5px}
.hstat-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}
.hstat-pill.completed{background:var(--green-tint);color:var(--green-600)}
.hstat-pill.partial{background:rgba(245,158,11,.14);color:#b45309}
.hstat-pill.pending{background:var(--line);color:var(--ink-3)}
.hc-goal{font-size:11px;color:var(--ink-3);margin-top:8px}
.week-tracker{display:flex;gap:5px}
.week-cell{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;border:2px solid var(--line-2);background:var(--card);color:var(--ink-3);cursor:pointer;flex:0 0 29px;transition:.12s}
.week-cell:hover{border-color:var(--ink-3)}
.week-cell.done{background:var(--green);border-color:var(--green);color:#fff}
.week-cell.partial{background:var(--amber);border-color:var(--amber);color:#fff}
.week-cell.istoday{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--green)}
.hc-right{flex:0 0 118px;text-align:right}
.hc-right .sr{font-size:19px;font-weight:800}
.hc-right .srl{font-size:10px;color:var(--ink-3);font-weight:700}
.hc-right .bs{font-size:13px;font-weight:800;margin-top:8px}
.hc-right .bsl{font-size:10px;color:var(--ink-3);font-weight:700}
.hc-foot{display:flex;align-items:center;gap:10px;margin-top:13px}
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heatmap .hm-cell{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heatmap-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:8px;font-size:10px;color:var(--ink-3);font-weight:600}
.heatmap-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ai-coach{background:linear-gradient(135deg,var(--green-tint),transparent);border-radius:16px;padding:16px}
.ai-coach .aih{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--green-600);margin-bottom:8px}
.ai-coach p{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:0 0 12px}
.tip-card{background:linear-gradient(135deg,rgba(59,130,246,.12),transparent);border-radius:16px;padding:16px}
.tip-card .tih{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--blue);margin-bottom:6px}
.tip-card p{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin:0}
.perf-row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.perf-row:last-child{margin-bottom:0}
.perf-row .pi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 26px}
.perf-row .pn{flex:1;font-size:12px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf-row .pv{font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap}
/* ---- work dashboard ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.wtask-scroll{overflow-x:auto}
.wtask-head,.wtask-row{display:grid;grid-template-columns:22px minmax(110px,2fr) 54px 50px 72px 70px 46px 22px;gap:6px;align-items:center;padding:11px 6px;min-width:460px}
.wtask-head{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:2px;white-space:nowrap}
.wtask-row{border-bottom:1px solid var(--line);transition:.14s}
.wtask-row:last-child{border-bottom:none}
.wtask-row:hover{background:var(--bg)}
.wtask-row .dots{width:22px;height:22px;flex:0 0 22px}
.wtask-name{min-width:0}
.wtn{font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--ink)}
.wcc{font-size:10.5px;color:var(--ink-3);font-weight:700;display:inline-flex;align-items:center;gap:2px}
.wchip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:7px;display:inline-block;margin-top:4px}
.wdue{font-size:12px;font-weight:600;color:var(--ink-2)}
.wdue.over{color:var(--red);font-weight:800}
.pri-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;text-align:center;white-space:nowrap}
.pri-Low{background:rgba(20,184,166,.14);color:#0d9488}
.pri-Medium{background:rgba(245,158,11,.16);color:#b45309}
.pri-High{background:rgba(239,68,68,.14);color:#dc2626}
.pri-Urgent{background:#ef4444;color:#fff}
.status-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap;text-align:center}
.st-not-started{background:var(--line);color:var(--ink-3)}
.st-in-progress{background:rgba(59,130,246,.14);color:#2563eb}
.st-blocked{background:rgba(239,68,68,.14);color:#dc2626}
.st-completed{background:var(--green-tint);color:var(--green-600)}
.wprog{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink-3)}
.avatars{display:flex}
.avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;border:2px solid var(--card);margin-left:-8px;flex:0 0 24px}
.avatars .avatar:first-child{margin-left:0}
.wsched-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wsched-item:last-child{border-bottom:none}
.wsched-time{font-size:11px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.5;white-space:nowrap;flex:0 0 60px}
.wsched-title{font-weight:700;font-size:13px}
.wsched-tag{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-top:1px}
.wproj-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.wproj-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.wproj-name{font-weight:600;font-size:12.5px;flex:0 0 110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wproj-pct{font-size:11.5px;font-weight:700;color:var(--ink-3);width:36px;text-align:right}
.wteam-title{font-weight:700;font-size:13px}
.wteam-row{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;border-radius:8px}
.wteam-row:hover{background:var(--bg)}
.wteam-name{flex:1;font-size:12.5px;font-weight:600}
.wteam-state{font-size:11px;font-weight:700}
.wteam-state.completed{color:var(--green-600)}
.wteam-state.in-progress{color:#2563eb}
.wteam-state.not-started{color:var(--ink-3)}
.wteam-sum{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.wteam-sum-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.wteam-sum .wteam-row{gap:10px}
.wdeadline-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wdeadline-item:last-child{border-bottom:none}
.wdeadline-date{width:40px;text-align:center;background:var(--bg);border-radius:9px;padding:5px 0;flex:0 0 40px}

 .app{flex-direction:column;padding:14px;gap:14px}

 .sidebar{width:auto;flex:none;height:auto;position:static;overflow:visible;padding:12px}
 .brand{padding:0 0 10px}
 #progressCard{display:none} /* redundant with the "Plan Adherence" stat tile already in the main content */

 nav::-webkit-scrollbar{display:none}
 .nav-item{width:auto;flex:0 0 auto;white-space:nowrap}
 /* the 74px time-gutter column is redundant on a phone-width card — the activity's own

    card into ~340px is exactly why a title+status-tag combo would wrap unpredictably
    and make neighboring timeline rows different heights */
 .tl-item{grid-template-columns:1fr}
 .tl-time{display:none}
 .stats{grid-template-columns:1fr}.stats5{grid-template-columns:1fr}.stats6{grid-template-columns:1fr 1fr}.tips{grid-template-columns:1fr}
 .goals-grid,.habits-grid{grid-template-columns:1fr}
 .wtask-head{display:none}
 .wtask-row{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 8px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;min-width:0}
 .wtask-scroll{overflow-x:visible}
 /* habit card header otherwise never wraps and overflows a phone-width card: icon + name +
    the fixed-width "Today" / week-tracker / streak blocks together need ~650px. hc-mid gets
    its own full-width row rather than squeezing onto the name's row — sharing a row left the
    name's flex-basis:0 shrunk below its own text's width (min-width:0 permits that), so the
    habit name visibly overlapped the "Today" label instead of wrapping or truncating */
 .hc-top{flex-wrap:wrap}
 .hc-mid{flex:1 1 100%;order:1}
 .week-tracker{flex:1 1 100%;justify-content:space-between;order:2}
 .hc-right{flex:1 1 auto;display:flex;align-items:center;gap:16px;text-align:left;order:3}
 .hc-top>.dots{order:3}
}
@media (max-width:480px){

 .datenav .dl{min-width:0}
 .donut-wrap{width:140px;height:140px}
 .donut-wrap svg{width:140px;height:140px}
}
body{overflow-x:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ============ Storage ============ */
const PREF='dp:pref';
const MEM={};
const DESK=(typeof window!=='undefined')&&window.dayplan&&window.dayplan.isDesktop?window.dayplan:null;
const hasStore=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';
// plain-browser (non-Electron, no host `window.storage`) persistence — lets the same renderer
// run as a regular web page and still keep data across reloads via the browser's own localStorage
const hasLocal=(()=>{try{return !DESK&&!hasStore&&typeof localStorage!=='undefined'&&!!localStorage;}catch(e){return false;}})();
const DB={
 async get(k){
   if(DESK){try{const v=await DESK.store.get(k);if(v!=null)return v;}catch(e){}}
   else if(hasStore){try{const r=await window.storage.get(k,false);if(r&&r.value!=null)return JSON.parse(r.value);}catch(e){}}
   else if(hasLocal){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v);}catch(e){}}
   return MEM[k]!=null?JSON.parse(MEM[k]):null;
 },
 async set(k,v){
   MEM[k]=JSON.stringify(v);
   if(DESK){try{await DESK.store.set(k,v);}catch(e){}}
   else if(hasStore){try{await window.storage.set(k,MEM[k],false);}catch(e){}}
   else if(hasLocal){try{localStorage.setItem(k,MEM[k]);}catch(e){}}
   return true;
 },
 async list(p){
   let keys=Object.keys(MEM).filter(k=>k.startsWith(p||''));
   if(DESK){try{const r=await DESK.store.list(p);if(r)keys=Array.from(new Set(keys.concat(r)));}catch(e){}}
   else if(hasStore){try{const r=await window.storage.list(p,false);if(r&&r.keys)keys=Array.from(new Set(keys.concat(r.keys)));}catch(e){}}
   else if(hasLocal){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p||''))keys.push(k);}keys=Array.from(new Set(keys));}catch(e){}}
   return keys;
 },
 async delete(k){
   delete MEM[k];
   if(DESK){try{await DESK.store.delete(k);}catch(e){}}
   else if(hasLocal){try{localStorage.removeItem(k);}catch(e){}}
   return true;
 },
};

/* ============ Cloud sync ============ */
const SYNC_API='https://dayplan-server.onrender.com';
const ACCOUNT_KEY='dp:account';
let account=null; // {email, token} — kept OUT of pref so a remote pull of 'dp:pref' can never clobber this device's own session
let lastSyncedAt=0; // in-memory only; resets each launch, purely for the "last synced" UI label
let syncState={pushed:{},lastPulledAt:0,syncing:false};
let syncDebounce=null;

function syncEnabled(){return !!(account&&account.token);}
function scheduleSync(){if(!syncEnabled())return;clearTimeout(syncDebounce);syncDebounce=setTimeout(syncNow,3000);}

async function apiFetch(path,opts){
 opts=opts||{};
 let res;
 try{res=await fetch(SYNC_API+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});}
 catch(e){throw Object.assign(new Error("Can't reach the sync server — check your internet connection and try again."),{status:0});}
 let body=null;try{body=await res.json();}catch(e){}
 if(!res.ok)throw Object.assign(new Error((body&&body.error)||('HTTP '+res.status)),{status:res.status});
 return body;
}
async function doRegister(email,password){
 let r;
 // a retried sign-up whose first attempt did reach the server finds its own new account already there
 try{r=await authFetch('/api/auth/register',{email,password});}
 catch(e){if(e.status===409&&e.retried)r=await authFetch('/api/auth/login',{email,password});else throw e;}
 await startSession(r);
 return r;
}
async function doLogin(email,password){
 const r=await authFetch('/api/auth/login',{email,password});
 await startSession(r);
 return r;
}
/* the account is usable as soon as the server answers — the first full sync can take a while (it pushes
   every local key), so it runs in the background instead of holding the login screen hostage until it ends */
async function startSession(r){
 account={email:r.email,token:r.token};await DB.set(ACCOUNT_KEY,account);
 const owner=await DB.get(OWNER_KEY),me=String(r.email).toLowerCase();
 if(owner&&owner!==me){await wipeLocalData();await DB.set(OWNER_KEY,me);location.reload();return;}
 await DB.set(OWNER_KEY,me);
 syncState={pushed:{},lastPulledAt:0,syncing:false};
 teamsLoaded=false;
 syncNow().then(()=>{if(view==='settings')render();});
}
/* Render's free plan sleeps the server after ~15 idle minutes and the first request then waits ~30–60s for it
   to boot — pinging health as soon as the login form shows starts that boot while the user is still typing */
let authBusy=null,authEmail='',authName='',authMode='login',serverWoken=false;
const PENDING_NAME_KEY='dpPendingName';
function wakeSyncServer(){if(serverWoken)return;serverWoken=true;fetch(SYNC_API+'/api/health').catch(()=>{serverWoken=false;});}
/* sign-in on a just-woken free-tier server: while it boots, Render answers 502/503/504 or drops the
   connection, so those are retried for up to ~90s; each try is capped so a hung request can't freeze the form */
async function authFetch(path,body){
 const until=Date.now()+90000;let wait=2000,tries=0;
 for(;;){
   const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);
   try{tries++;return await apiFetch(path,{method:'POST',body:JSON.stringify(body),signal:ctl.signal});}
   catch(e){e.retried=tries>1;if(![0,502,503,504].includes(e.status)||Date.now()+wait>until)throw e;}
   finally{clearTimeout(timer);}
   const n=document.getElementById('acc-note');if(n)n.textContent='The sync server is waking up — still trying, please keep this open…';
   await new Promise(r=>setTimeout(r,wait));wait=Math.min(wait*1.5,8000);
 }
}
/* which account the data on this device belongs to — deliberately not a 'dp:' key, so it is never synced */
const OWNER_KEY='dpOwner';
const DEVICE_KEYS=['dp:minimizeToTray'];
async function wipeLocalData(){
 clearTimeout(saveTimer);clearTimeout(syncDebounce);
 const keys=await DB.list('dp:');
 for(const k of keys)if(k!==ACCOUNT_KEY&&!DEVICE_KEYS.includes(k))await DB.delete(k);
}
/* everything is uploaded first, then this device's copy is erased so the next person to use the app
   (or log in) sees none of it; it comes back from the server on the next login */
async function doLogout(){
 clearTimeout(saveTimer);await DB.set(dayKey(dayStr),day);await DB.set(PREF,pref);
 while(syncState.syncing)await new Promise(r=>setTimeout(r,200));
 if(!await syncNow()){
   if(!account){render();throw new Error('Your session expired. Log in again to save your latest changes, then log out.');}
   throw new Error("Couldn't upload your latest changes, so you're still logged in and nothing was removed. Check your connection and try again.");
 }
 account=null;await DB.delete(ACCOUNT_KEY);await DB.delete(OWNER_KEY);
 syncState={pushed:{},lastPulledAt:0,syncing:false};
 myTeams=[];teamStateCache={};teamsLoaded=false;
 await wipeLocalData();
 location.reload();
}

/* ============ Team collaboration (server-backed, separate from the private per-account sync above) ============
   Shared tasks are NOT part of `pref` — they live on the VPS in their own tables (teams/team_members/
   shared_tasks/shared_task_status/shared_task_comments) so every member's completion state is independent
   and every member sees live changes from the others, not just their own synced copy. */
let myTeams=[],teamStateCache={},teamsLoaded=false;
function authHeaders(){return{Authorization:'Bearer '+account.token};}
async function refreshMyTeams(){if(!syncEnabled())return;const r=await apiFetch('/api/team/mine',{headers:authHeaders()});myTeams=r.teams||[];}
/* the server only stores a status row once a member has set one (a new task gets a row for its creator alone),
   so every member without a row is filled in as "Not Started" — otherwise teammates who haven't touched a task
   simply vanish from its progress and "1 / 1 completed" hides that anyone else is on it */
function normalizeTeamState(r){
 const emails=(r.members||[]).map(m=>m.email);
 (r.tasks||[]).forEach(t=>{t.statuses=t.statuses||{};emails.forEach(e=>{if(!t.statuses[e])t.statuses[e]='Not Started';});});
 return r;
}
async function fetchTeamState(teamId){if(!syncEnabled())return null;const r=normalizeTeamState(await apiFetch('/api/team/'+teamId+'/state',{headers:authHeaders()}));teamStateCache[teamId]=r;return r;}
let teamsFetchedAt=0,teamsRefreshing=false;
async function ensureTeamsLoaded(){
 if(teamsLoaded||!syncEnabled())return;
 teamsLoaded=true;
 try{await refreshMyTeams();await Promise.all(myTeams.map(t=>fetchTeamState(t.id)));teamsFetchedAt=Date.now();}catch(e){teamsLoaded=false;}
}
/* teammates change their statuses on their own devices, so team state is re-fetched in the background —
   on opening the Work tab (at most every 30s), every minute while it stays open, and when the window regains focus */
async function refreshTeamsInBackground(force){
 if(!syncEnabled()||teamsRefreshing||!teamsLoaded)return;
 if(!force&&Date.now()-teamsFetchedAt<30000)return;
 teamsRefreshing=true;
 try{await refreshMyTeams();await Promise.all(myTeams.map(t=>fetchTeamState(t.id)));teamsFetchedAt=Date.now();if(view==='work'&&workUI.section!=='mywork')render();}
 catch(e){console.error('team refresh failed',e);}
 teamsRefreshing=false;
}
setInterval(()=>{if(view==='work'&&workUI.section!=='mywork'&&document.visibilityState!=='hidden')refreshTeamsInBackground(true);},60000);
window.addEventListener('focus',()=>{if(view==='work')refreshTeamsInBackground();});
async function createTeamRemote(name){const r=await apiFetch('/api/team/create',{method:'POST',headers:authHeaders(),body:JSON.stringify({name})});await refreshMyTeams();await fetchTeamState(r.id);return r;}
async function joinTeamRemote(code){const r=await apiFetch('/api/team/join',{method:'POST',headers:authHeaders(),body:JSON.stringify({inviteCode:code})});await refreshMyTeams();await fetchTeamState(r.id);return r;}
async function createSharedTaskRemote(teamId,fields){const r=await apiFetch('/api/team/'+teamId+'/tasks',{method:'POST',headers:authHeaders(),body:JSON.stringify(fields)});await fetchTeamState(teamId);return r;}
async function updateSharedTaskRemote(teamId,taskId,fields){await apiFetch('/api/team/tasks/'+taskId,{method:'PATCH',headers:authHeaders(),body:JSON.stringify(fields)});await fetchTeamState(teamId);}
async function deleteSharedTaskRemote(teamId,taskId){await apiFetch('/api/team/tasks/'+taskId,{method:'DELETE',headers:authHeaders()});await fetchTeamState(teamId);}
async function setSharedTaskStatusRemote(teamId,taskId,status){await apiFetch('/api/team/tasks/'+taskId+'/status',{method:'PATCH',headers:authHeaders(),body:JSON.stringify({status})});await fetchTeamState(teamId);}
async function addSharedCommentRemote(teamId,taskId,text){await apiFetch('/api/team/tasks/'+taskId+'/comments',{method:'POST',headers:authHeaders(),body:JSON.stringify({text})});await fetchTeamState(teamId);}
function findSharedTask(teamId,taskId){const st=teamStateCache[teamId];return st&&(st.tasks||[]).find(x=>x.id===taskId);}
function allSharedTasks(){const out=[];myTeams.forEach(t=>{const st=teamStateCache[t.id];(st&&st.tasks||[]).forEach(task=>out.push({teamId:t.id,teamName:t.name,task}));});return out;}
async function createSharedRecurringTaskRemote(teamId,fields){const r=await apiFetch('/api/team/'+teamId+'/recurring-tasks',{method:'POST',headers:authHeaders(),body:JSON.stringify(fields)});await fetchTeamState(teamId);return r;}
async function updateSharedRecurringTaskRemote(teamId,rtId,fields){await apiFetch('/api/team/recurring-tasks/'+rtId,{method:'PATCH',headers:authHeaders(),body:JSON.stringify(fields)});await fetchTeamState(teamId);}
async function deleteSharedRecurringTaskRemote(teamId,rtId){await apiFetch('/api/team/recurring-tasks/'+rtId,{method:'DELETE',headers:authHeaders()});await fetchTeamState(teamId);}
function findSharedRecurring(teamId,rtId){const st=teamStateCache[teamId];return st&&(st.recurringTasks||[]).find(x=>x.id===rtId);}
function allSharedRecurringTasks(){const out=[];myTeams.forEach(t=>{const st=teamStateCache[t.id];(st&&st.recurringTasks||[]).forEach(rt=>out.push({teamId:t.id,teamName:t.name,rt}));});return out;}
/* auto-link each new recurring-shared occurrence to MY OWN DayPlan at the template's default time —
   mirrors ensureRecurringOccurrences() for local tasks, but only ever touches this device's own
   day.activities, never another member's calendar */
async function ensureTeamRecurringSchedules(){
 const items=allSharedRecurringTasks().filter(x=>x.rt.schedStart&&x.rt.schedEnd);
 for(const {teamId,rt} of items){
   const occs=allSharedTasks().filter(x=>x.teamId===teamId&&x.task.recurringId===rt.id);
   for(const {task} of occs){
     const d=await DB.get(dayKey(task.occurrenceDate));
     const already=d&&(d.activities||[]).some(a=>a.workTaskId===task.id);
     if(!already)await scheduleTaskToDayPlan(task,task.occurrenceDate,rt.schedStart,rt.schedEnd);
   }
 }
}
function emailColor(email){let h=0;for(let i=0;i<email.length;i++)h=(h*31+email.charCodeAt(i))>>>0;return ACT_COLORS[h%ACT_COLORS.length];}
function emailName(email){return (email||'').split('@')[0];}
async function collectSyncableEntries(){
 const keys=await DB.list('dp:');
 const entries=[];
 for(const k of keys){
   if(k===ACCOUNT_KEY)continue; // never sync the session token itself
   const v=await DB.get(k);
   if(v==null)continue;
   entries.push({key:k,value:v});
 }
 return entries;
}
async function syncRound(pullOnly){
 const changes=[];
 if(!pullOnly){
   const entries=await collectSyncableEntries();
   const now=Date.now();
   for(const {key,value} of entries){
     const ser=JSON.stringify(value);
     if(syncState.pushed[key]!==ser)changes.push({key,value:ser,updatedAt:now});
   }
 }
 const data=await apiFetch('/api/store/sync',{method:'POST',headers:{Authorization:'Bearer '+account.token},body:JSON.stringify({since:syncState.lastPulledAt,changes})});
 changes.forEach(c=>{syncState.pushed[c.key]=c.value;});
 let touchedCurrent=false;
 for(const c of data.changes){
   if(c.key===ACCOUNT_KEY)continue;
   if(c.deleted){
     await DB.delete(c.key);delete syncState.pushed[c.key];
     if(c.key.startsWith('dp:mw:'))mwInvalidate();
     if(c.key===dayKey(dayStr))touchedCurrent=true;
   }else{
     const parsed=JSON.parse(c.value);
     await DB.set(c.key,parsed);syncState.pushed[c.key]=c.value;
     if(c.key.startsWith('dp:mw:')){mwInvalidate();if(view==='work')touchedCurrent=true;}
     if(c.key===PREF){pref=parsed;touchedCurrent=true;}
     else if(c.key===dayKey(dayStr)){day=parsed;touchedCurrent=true;}
   }
 }
 syncState.lastPulledAt=data.serverTime;
 lastSyncedAt=data.serverTime;
 return touchedCurrent;
}
async function syncNow(){
 if(!syncEnabled()||syncState.syncing)return false;
 syncState.syncing=true;let ok=false;
 try{
   // always pull and merge remote changes BEFORE computing what to push. A day's data is synced
   // as one whole blob per key, and fields like screenMin auto-update on their own — so if we
   // pushed using a locally-stale blob (one that hasn't yet absorbed a newer edit another device
   // made to the same day), that stale push would clobber the newer edit via last-write-wins.
   // Pulling first ensures every push starts from the freshest known state.
   let touchedCurrent=await syncRound(true);
   touchedCurrent=await syncRound(false)||touchedCurrent;
   if(touchedCurrent&&typeof render==='function')render();
   ok=true;
 }catch(e){
   if(e.status===401){account=null;await DB.delete(ACCOUNT_KEY);toast('Sync session expired — please log in again.');}
   console.error('sync failed',e);
 }
 syncState.syncing=false;
 return ok;
}
setInterval(()=>{if(syncEnabled())syncNow();},120000);

/* ============ Time helpers ============ */
const DAYNAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function toHM(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function fmt12(t){const[h,m]=t.split(':').map(Number);const ap=h<12?'AM':'PM';const hh=h%12||12;return hh+':'+String(m).padStart(2,'0')+' '+ap;}
function durLabel(s,e){let d=toMin(e)-toMin(s);if(d<=0)d+=1440;const h=Math.floor(d/60),m=d%60;return (h?h+'h':'')+(m?(h?' ':'')+m+'m':'');}
function interval(a){let s=toMin(a.start),e=toMin(a.end);if(e<=s)e+=1440;return [s,e];}
function isNowActive(a){if(a.status!=='pending'||dayStr!==todayStr())return false;const n=nowMin(),s=toMin(a.start);let e=toMin(a.end);if(e<=s){return n>=s||n<e;}return n>=s&&n<e;}
/* an activity is "missed" once its own end time has passed while it's still sitting pending — never auto-set, purely a display state until the user acts on it */
function isMissedOn(ds,a){if(a.status!=='pending'||ds>todayStr())return false;const [,e]=interval(a);const n=ds===todayStr()?nowMin():1440;return n>=e;}
function isMissed(a){return isMissedOn(dayStr,a);}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(ds,n){const[y,m,d]=ds.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()+n);return dt.toISOString().slice(0,10);}
function dowOf(ds){return new Date(ds+'T00:00').getDay();}
function dateLabel(ds){const d=new Date(ds+'T00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function hoursLabel(min){const h=Math.floor(min/60),m=Math.round(min%60);return (h?h+'h ':'')+(m?m+'m':(h?'':'0m'));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function num(v){return Math.max(0,Number(String(v).replace(/[^0-9.]/g,''))||0);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

/* ============ Templates / recurrence ============ */
const RECUR=[['daily','Every day'],['weekday','Weekdays'],['weekend','Weekends'],['weekly','Specific days'],['once','One time']];
function appliesToday(t,ds){const dw=dowOf(ds);if(t.recur==='daily')return true;if(t.recur==='weekday')return dw>=1&&dw<=5;if(t.recur==='weekend')return dw===0||dw===6;if(t.recur==='weekly'||t.recur==='custom')return (t.days||[]).includes(dw);if(t.recur==='once')return t.date===ds;return false;}
function generateActivities(ds){
 return (pref.templates||[]).filter(t=>appliesToday(t,ds)).map(t=>({id:id(),tid:t.id,title:t.title,icon:t.icon,color:t.color,start:t.start,end:t.end,status:'pending',goalId:t.goalId||null}))
   .sort((a,b)=>toMin(a.start)-toMin(b.start));
}

/* ============ Conflict detection ============ */
function conflicts(acts){
 const out=[];const a=[...acts].sort((x,y)=>toMin(x.start)-toMin(y.start));
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
   const [s1,e1]=interval(a[i]),[s2,e2]=interval(a[j]);
   if(Math.max(s1,s2)<Math.min(e1,e2)&&a[i].icon!=='bed'&&a[j].icon!=='bed'){out.push([a[i],a[j]]);}
 }
 return out;
}
function freeSlots(acts){
 const busy=acts.filter(a=>a.icon!=='bed').map(interval).sort((x,y)=>x[0]-y[0]);
 const slots=[];let cur=6*60;
 busy.forEach(([s,e])=>{if(s-cur>=30)slots.push([cur,s]);cur=Math.max(cur,e);});
 if(23*60-cur>=30)slots.push([cur,23*60]);
 return slots.slice(0,3);
}

 const missed=acts.filter(a=>isMissedOn(ds,a)).length;
 const adherence=Math.round(done/total*100);
 return {total:acts.length,done,skipped,missed,adherence,focus:d.focusMin||0,screen:d.screenMin||0};
}

/* ---- habit helpers ---- */
function habitBestStreak(hb){
 if(!hb.history)return 0;
 const dates=Object.keys(hb.history).filter(d=>hb.history[d]===true).sort();
 if(!dates.length)return 0;
 let best=1,cur=1;
 for(let i=1;i<dates.length;i++){
   const diffDays=Math.round((new Date(dates[i]+'T00:00')-new Date(dates[i-1]+'T00:00'))/86400000);
   if(diffDays===1){cur++;best=Math.max(best,cur);}else cur=1;
 }
 return Math.max(best,cur);
}
function habitSuccessRate(hb,days){
 days=days||30;
 const dates=[...Array(days)].map((_,i)=>addDays(todayStr(),-(days-1)+i));
 let score=0;
 dates.forEach(d=>{const v=hb.history&&hb.history[d];if(v===true)score+=1;else if(v==='partial')score+=.5;});
 return Math.round(score/days*100);
}
function habitTodayStatus(hb){
 const v=hb.history&&hb.history[todayStr()];
 if(v===true)return 'completed';
 if(v==='partial')return 'partial';
 return 'pending';
}
function habitDayCounts(days){
 let done=0,partial=0,missed=0;
 (pref.habits||[]).forEach(hb=>days.forEach(ds=>{
   const v=hb.history&&hb.history[ds];
   if(v===true)done++;else if(v==='partial')partial++;else missed++;
 }));
 return {done,partial,missed,total:done+partial+missed};
}
function worstWeekdayFor(hb,weeks){
 weeks=weeks||6;
 const counts=[0,0,0,0,0,0,0],totals=[0,0,0,0,0,0,0];
 for(let i=0;i<weeks*7;i++){const ds=addDays(todayStr(),-i-1);const dw=dowOf(ds);totals[dw]++;if(hb.history&&hb.history[ds]===true)counts[dw]++;}
 let worstIdx=-1,worstRate=1;
 for(let i=0;i<7;i++){if(totals[i]<2)continue;const rate=counts[i]/totals[i];if(rate<worstRate){worstRate=rate;worstIdx=i;}}
 return worstIdx>=0&&worstRate<0.5?{day:DAYNAMES[worstIdx],rate:Math.round(worstRate*100)}:null;
}

/* ---- goal helpers ---- */
function linkedHabitFor(g){return (pref.habits||[]).find(h=>h.goalId===g.id);}
function linkedTemplatesFor(g){return (pref.templates||[]).filter(t=>t.goalId===g.id);}
function goalStatus(g){
 const p=goalBar(g).p;
 if(p>=100)return 'completed';
 if(g.targetDate&&g.targetDate<todayStr())return 'overdue';
 return 'active';
}
function nextGoalSession(g){
 const tpls=linkedTemplatesFor(g);
 if(!tpls.length)return null;
 const n=nowMin();
 for(let i=0;i<8;i++){
   const ds=addDays(todayStr(),i);
   const applic=tpls.filter(t=>appliesToday(t,ds)).sort((a,b)=>toMin(a.start)-toMin(b.start));
   for(const t of applic){
     if(i===0&&toMin(t.start)<n)continue;
     const label=i===0?'Today':i===1?'Tomorrow':DAYNAMES[dowOf(ds)];
     return `${label}, ${fmt12(t.start)}`;
   }
 }
 return null;
}
function sortGoals(list,mode){
 const arr=[...list];
 const statusRank={overdue:0,active:1,completed:2};
 if(mode==='progress')arr.sort((a,b)=>goalBar(b).p-goalBar(a).p);
 else if(mode==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));
 else if(mode==='date')arr.sort((a,b)=>(a.targetDate||'9999-12-31').localeCompare(b.targetDate||'9999-12-31'));
 else arr.sort((a,b)=>{const r=statusRank[goalStatus(a)]-statusRank[goalStatus(b)];if(r)return r;return (a.targetDate||'9999-12-31').localeCompare(b.targetDate||'9999-12-31');});
 return arr;
}

/* current-time dot that travels along the timeline rail, interpolated by clock time */
function positionNowMarker(){
 const body=document.getElementById('tlBody');if(!body)return;
 const marker=body.querySelector('#tlNow');if(!marker)return;
 if(tlMode!=='timeline'||dayStr!==todayStr()){marker.style.display='none';return;}
 const items=[...body.querySelectorAll('.tl-item')];
 const pts=items.map(it=>{
   const mid=it.querySelector('.tl-mid');const actEl=it.querySelector('[data-id]');
   if(!mid||!actEl)return null;
   const a=day.activities.find(x=>x.id===actEl.dataset.id);if(!a)return null;
   return{t:toMin(a.start),x:it.offsetLeft+mid.offsetLeft+11,y:it.offsetTop+mid.offsetTop+11.5};
 }).filter(Boolean).sort((p,q)=>p.t-q.t);
 if(!pts.length){marker.style.display='none';return;}
 const n=nowMin();let x,y;
 if(n<=pts[0].t){x=pts[0].x;y=pts[0].y;}
 else if(n>=pts[pts.length-1].t){x=pts[pts.length-1].x;y=pts[pts.length-1].y;}
 else{
   let p0=pts[0],p1=pts[pts.length-1];
   for(let i=0;i<pts.length-1;i++){if(n>=pts[i].t&&n<=pts[i+1].t){p0=pts[i];p1=pts[i+1];break;}}
   const f=(n-p0.t)/Math.max(1,(p1.t-p0.t));
   x=p0.x+(p1.x-p0.x)*f;y=p0.y+(p1.y-p0.y)*f;
 }
 marker.style.display='block';
 marker.style.transform=`translate(${x}px,${y}px)`;
}

function donutHTML(completed,inProgress,overdue,total,avgProgress){
 const r=70,circ=2*Math.PI*r;
 const segs=[{n:completed,color:'#22c55e'},{n:inProgress,color:'#3b82f6'},{n:overdue,color:'#f59e0b'}];
 let offset=0;
 const circles=segs.map(s=>{
   const frac=total?s.n/total:0,len=frac*circ,dashoffset=-offset;
   offset+=len;
   return len>0?`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${dashoffset}"/>`:'';
 }).join('');
 return `<div class="donut-wrap">
  <svg viewBox="0 0 180 180" width="170" height="170" style="transform:rotate(-90deg)">
   <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--line)" stroke-width="16"/>
   ${circles}
  </svg>
  <div class="donut-center"><b>${avgProgress}%</b><span>Overall Progress</span></div>
 </div>
 <div class="donut-legend">
  <div class="dl-row"><span class="dot" style="background:#22c55e"></span>Completed<b>${completed} (${total?Math.round(completed/total*100):0}%)</b></div>

 </div>`;
}

/* ============ VIEW: Work Dashboard ============
   Personal tasks live in pref (synced privately per-account like everything else):
   pref.workProjects   [{id,name,color,icon}]
   pref.workTasks       [{id,title,description,projectId,dueDate,priority,status,progress,
                          recurringId,occurrenceDate,schedule:[{id,date,start,end}],comments:[],history:[],createdAt,completedAt}]
   pref.recurringTasks [{id,title,description,projectId,priority,freq,days,dayOfMonth,time,createdAt}]
   A recurring task is a template; ensureRecurringOccurrences() materializes it into ordinary workTasks (one per
   due date) so each occurrence keeps its own independent status/progress/comments, per the "template → occurrences"
   requirement — never mutate a single task's due date to represent recurrence.
   A workTask can be linked to one or more DayPlan activities (day.activities[].workTaskId) via scheduleTaskToDayPlan();
   the task stays the single source of truth and is never duplicated into a second record.

   Shared/team tasks are NOT part of pref at all — they live on the VPS sync server (teams/shared_tasks/
   shared_task_status/shared_task_comments tables) so every member's completion state is genuinely independent
   and visible to every other member, not just synced copies of one person's data. See the "Team collaboration"
   API layer above (refreshMyTeams, fetchTeamState, createSharedTaskRemote, setSharedTaskStatusRemote, etc.) and
   teamsModal()/teamTaskDetailModal(). Recurring + team-shared is not combined yet — recurring stays personal-only.
*/
let workUI={tab:'all',q:'',filterView:null,section:'tasks'};
const WORK_TABS=[['all','All'],['today','Due Today'],['upcoming','Upcoming'],['overdue','Overdue'],['inprogress','In Progress'],['completed','Completed']];
function taskProject(t){return (pref.workProjects||[]).find(p=>p.id===t.projectId)||null;}
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function slug(s){return String(s).toLowerCase().replace(/\s+/g,'-');}
function dateLabelShort(ds){const d=new Date(ds+'T00:00');return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);}
function isOverdue(t){return !!(t.dueDate&&t.dueDate<todayStr()&&t.status!=='Completed');}
function pushTaskHistory(t,text){t.history=t.history||[];t.history.push({ts:Date.now(),text});}
function setTaskStatus(t,status){
 if(status==='Completed'){
   if(t.status!=='Completed')t._prevProgress=t.progress||0; // remember it so reopening doesn't strand progress at 100
   t.progress=100;t.completedAt=todayStr();
 }else{
   if(t.status==='Completed'){t.progress=t._prevProgress!=null?t._prevProgress:t.progress;delete t._prevProgress;}
   delete t.completedAt;
 }
 t.status=status;pushTaskHistory(t,'Status → '+status);
}

 q('#cf-yes').onclick=()=>{closeModal();onConfirm();};
}
/* if a recurring occurrence is explicitly deleted, remember its date on the template so the next
   lazy-generation pass doesn't silently recreate it */
function skipOccurrenceIfDeleted(t){
 if(!t.recurringId||!t.occurrenceDate)return;
 const rt=(pref.recurringTasks||[]).find(x=>x.id===t.recurringId);if(!rt)return;
 rt.skipDates=rt.skipDates||[];
 if(!rt.skipDates.includes(t.occurrenceDate))rt.skipDates.push(t.occurrenceDate);
}
async function cycleMyTeamStatus(teamId,taskId){

}

/* materialize this week's/today's/this month's occurrences from recurring templates, without duplicating existing ones */
function dateStrOf(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
/* dates this week (or this month) matching the template, excluding anything dated before the series
   existed — but if that filter empties out the whole window (e.g. series created on a Saturday for a
   "every Friday" task, so this week's Friday already passed), look ahead to the next window instead of
   surfacing nothing at all until next week rolls over naturally */
function recurringWindowDates(rt,today,createdDateStr){
 if(rt.freq==='daily')return[today];
 if(rt.freq==='monthly'){
   const dom=Math.min(rt.dayOfMonth||1,28);
   const mk=ds=>{const [y,m]=ds.split('-').map(Number);return `${y}-${String(m).padStart(2,'0')}-${String(dom).padStart(2,'0')}`;};
   let candidate=mk(today);
   if(candidate<createdDateStr){const [y,m]=today.split('-').map(Number);const nm=new Date(Date.UTC(y,m,1));candidate=`${nm.getUTCFullYear()}-${String(nm.getUTCMonth()+1).padStart(2,'0')}-${String(dom).padStart(2,'0')}`;}
   return[candidate];
 }
 let candidates=weekDates(today).filter(ds=>(rt.days||[]).includes(dowOf(ds))&&ds>=createdDateStr);
 if(!candidates.length){
   const nextWeekStart=addDays(weekDates(today)[0],7);
   candidates=[...Array(7)].map((_,i)=>addDays(nextWeekStart,i)).filter(ds=>(rt.days||[]).includes(dowOf(ds))&&ds>=createdDateStr);
 }
 return candidates;
}
function ensureRecurringOccurrences(){
 pref.recurringTasks=pref.recurringTasks||[];pref.workTasks=pref.workTasks||[];
 let changed=false;
 pref.recurringTasks.forEach(rt=>{
   const createdDateStr=rt.createdAt?dateStrOf(rt.createdAt):'0000-00-00';
   const dates=recurringWindowDates(rt,todayStr(),createdDateStr);
   dates.forEach(ds=>{
     if((rt.skipDates||[]).includes(ds))return;
     if(pref.workTasks.some(t=>t.recurringId===rt.id&&t.occurrenceDate===ds))return;
     pref.workTasks.push({id:id(),title:rt.title,description:rt.description||'',projectId:rt.projectId||'',
       dueDate:ds,priority:rt.priority||'Medium',status:'Not Started',progress:0,
       recurringId:rt.id,occurrenceDate:ds,schedule:[],comments:[],
       history:[{ts:Date.now(),text:'Occurrence created'}],createdAt:Date.now()});
     changed=true;
   });
 });
 if(changed)queueSave();
}

/* schedules a work session for a task into a given DayPlan day — the activity links back via workTaskId so the
   task is never duplicated, only referenced from Today */
async function scheduleTaskToDayPlan(task,date,start,end){
 const proj=taskProject(task);
 const entry={id:id(),workTaskId:task.id,title:task.title,icon:'work',color:proj?proj.color:'#6366f1',start,end,status:'pending'};
 if(date===dayStr){
   day.activities=day.activities||[];day.activities.push(entry);await DB.set(dayKey(dayStr),day);
 }else{
   let d=await DB.get(dayKey(date));
   if(!d)d={planned:false,activities:generateActivities(date),priorities:[],focusMin:0,screenMin:0,review:null};
   d.activities=d.activities||[];d.activities.push(entry);await DB.set(dayKey(date),d);
 }
 task.schedule=task.schedule||[];task.schedule.push({id:entry.id,date,start,end});
 pushTaskHistory(task,'Scheduled '+dateLabel(date)+', '+fmt12(start)+'–'+fmt12(end));
}
