/* ============ My Work — weekly work categories & activity journal ============
   Categories live in one key (dp:mw:cats); every week is its own key (dp:mw:week:<monday>) holding the
   categories selected for that week plus that week's entries. Starting a new week therefore never touches
   an older one, and each week syncs as its own blob through the regular dp:* sync, just like a day does.
   Categories are archived, never deleted, so a past week can always resolve its category names. */
const MW_CATS='dp:mw:cats';
const MW_WEEK_PREFIX='dp:mw:week:';
const mwWeekKey=w=>MW_WEEK_PREFIX+w;
const MW_STATUSES=['Completed','In Progress','Pending','Blocked'];
const MW_STATUS_COLOR={'Completed':'#22c55e','In Progress':'#3b82f6','Pending':'#f59e0b','Blocked':'#ef4444'};
const MW_FIELDS=[['outcome','Outcome / result','What came out of it — decisions, deliverables, results…'],['findings','Technical findings & observations','Findings, evidence, observations…'],['challenges','Challenges / dependencies','What slowed this down, or what it depends on…'],['notes','Additional notes','Anything else worth remembering…']];
const MW_ICONS=['flag','book','alert','tasks','work','gauge','search','mic','tag','brain','notes','goal','star','trophy','calendar','clock','grad','coffee'];
const MW_SUGGESTED=[
 ['Cybersecurity Relevance Determination','flag','#3b82f6'],['Cyber Case Review','book','#8b5cf6'],['Cyber Vulnerability Review','alert','#ef4444'],
 ['Cybersecurity Requirements Review','tasks','#14b8a6'],['Security Architecture Review','work','#6366f1'],['Threat Analysis and Risk Assessment','gauge','#f97316'],
 ['Security Research','search','#0ea5e9'],['Technical Discussions and Meetings','mic','#ec4899'],['Other Activities','tag','#f59e0b']];
const mwUI={week:null,tab:'categories',cat:null,q:''};
let mwCats=null,mwAllLoaded=false;
const mwWeeks={};

async function mwLoadCats(){if(!mwCats)mwCats=(await DB.get(MW_CATS))||[];return mwCats;}
function mwSaveCats(){DB.set(MW_CATS,mwCats);scheduleSync();}
async function mwGetWeek(w){
 if(!mwWeeks[w]){const v=await DB.get(mwWeekKey(w));if(!mwWeeks[w])mwWeeks[w]=v||{weekStart:w,categoryIds:[],entries:[]};}
 return mwWeeks[w];
}
function mwSaveWeek(wk){const now=Date.now();wk.updatedAt=now;if(!wk.createdAt)wk.createdAt=now;mwWeeks[wk.weekStart]=wk;DB.set(mwWeekKey(wk.weekStart),wk);scheduleSync();}
/* every week that has anything recorded, newest first */
async function mwLoadAllWeeks(){
 if(!mwAllLoaded){
   for(const k of await DB.list(MW_WEEK_PREFIX)){const w=k.slice(MW_WEEK_PREFIX.length);if(!mwWeeks[w]){const v=await DB.get(k);if(v&&!mwWeeks[w])mwWeeks[w]=v;}}
   mwAllLoaded=true;
 }
 return Object.values(mwWeeks).filter(wk=>wk.categoryIds.length||wk.entries.length).sort((a,b)=>b.weekStart.localeCompare(a.weekStart));
}
/* a sync pull changed My Work data on disk — drop the in-memory copies so the next read reloads them */
function mwInvalidate(){mwCats=null;mwAllLoaded=false;Object.keys(mwWeeks).forEach(k=>delete mwWeeks[k]);}

function mwWeekOf(ds){return weekDates(ds)[0];}
function mwMon(d){return MONTHS[d.getMonth()].slice(0,3);}
function mwWeekLabel(w){const a=new Date(w+'T00:00'),b=new Date(addDays(w,6)+'T00:00');return mwMon(a)+' '+a.getDate()+' – '+(a.getMonth()===b.getMonth()?'':mwMon(b)+' ')+b.getDate()+', '+b.getFullYear();}
function mwWeekShort(w){const a=new Date(w+'T00:00');return mwMon(a)+' '+a.getDate();}
function mwWeekNo(w){const th=new Date(addDays(w,3)+'T00:00Z');return Math.ceil(((th-Date.UTC(th.getUTCFullYear(),0,1))/864e5+1)/7);} // ISO week: the week containing its Thursday
function mwDayLabel(ds){const d=new Date(ds+'T00:00');return DAYNAMES[d.getDay()]+', '+mwMon(d)+' '+d.getDate();}
function mwCat(cid){return (mwCats||[]).find(c=>c.id===cid)||{id:cid,name:'Unknown category',description:'',color:'#94a3b8',icon:'tag',archived:true};}
function mwCatChip(c){return `<span class="wchip" style="background:${tint(c.color)};color:${c.color}">${esc(c.name)}</span>`;}
function mwProjChip(e){return e.project?`<span class="wchip mw-proj" title="Project">${svg('work',11)}${esc(e.project)}</span>`:'';}
/* project names to suggest: the Tasks & Projects list plus every name already used in My Work, de-duplicated */
async function mwProjectNames(){
 const seen=new Map();
 const add=n=>{n=(n||'').trim();if(n&&!seen.has(n.toLowerCase()))seen.set(n.toLowerCase(),n);};
 (pref.workProjects||[]).forEach(p=>add(p.name));
 (await mwLoadAllWeeks()).forEach(wk=>wk.entries.forEach(e=>add(e.project)));
 return [...seen.values()].sort((a,b)=>a.localeCompare(b));
}
function mwSuTitle(e){return e.title+(e.project?` [${e.project}]`:'');}
function mwStatusOf(e){return MW_STATUSES.includes(e.status)?e.status:'Pending';}
function mwCounts(es){const c={total:es.length,Completed:0,'In Progress':0,Pending:0,Blocked:0};es.forEach(e=>c[mwStatusOf(e)]++);return c;}
function mwOverall(c){if(!c.total)return 'Not Started';if(c.Blocked)return 'Blocked';if(c.Completed===c.total)return 'Completed';if(c['In Progress']||c.Completed)return 'In Progress';return 'Pending';}
function mwCountsLine(c){return c.total+' '+(c.total===1?'activity':'activities')+(c.total?': '+MW_STATUSES.filter(s=>c[s]).map(s=>c[s]+' '+s.toLowerCase()).join(', '):'');}
function mwBadge(s){return `<span class="status-badge st-${slug(s)}">${s}</span>`;}
function mwSortEntries(a,b){return a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0);}
/* the week's selected categories, then any category that still has entries this week after being removed from it */
function mwEntryCats(wk){const ids=[...wk.categoryIds];wk.entries.forEach(e=>{if(!ids.includes(e.categoryId))ids.push(e.categoryId);});return ids;}
function mwGoWeek(w){mwUI.week=w;mwUI.cat=null;mwUI.q='';if(mwUI.tab==='history')mwUI.tab='categories';render();}

/* ---- rich text: a small contenteditable editor; everything stored or rendered goes through mwSanitize ---- */
const MW_KEEP=new Set(['B','STRONG','I','EM','U','S','STRIKE','UL','OL','LI','BR','P','DIV','H3','H4','BLOCKQUOTE','PRE','CODE']);
const MW_DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','TITLE','HEAD','SVG','MATH','TEMPLATE','NOSCRIPT','IMG','PICTURE','VIDEO','AUDIO','CANVAS','INPUT','BUTTON','SELECT','TEXTAREA','FORM']);
function mwSanitize(html){
 if(!html)return '';
 const body=new DOMParser().parseFromString(String(html),'text/html').body;
 const clean=node=>[...node.childNodes].forEach(ch=>{
   if(ch.nodeType===3)return;
   if(ch.nodeType!==1||MW_DROP.has(ch.tagName)){ch.remove();return;}
   clean(ch);
   if(!MW_KEEP.has(ch.tagName)){ch.replaceWith(...ch.childNodes);return;}
   [...ch.attributes].forEach(a=>ch.removeAttribute(a.name));
 });
 clean(body);
 return body.textContent.trim()?body.innerHTML.trim():'';
}
/* cheap one-line plain text — for search, snippets and emptiness checks */
function mwPlain(html){return String(html||'').replace(/<(br|\/p|\/div|\/li|\/h\d|\/pre|\/blockquote)[^>]*>/gi,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();}
/* structured plain text (keeps lines and list bullets) — for the stand-up summary and copying */
function mwToText(html){
 const clean=mwSanitize(html);if(!clean)return '';
 const body=new DOMParser().parseFromString(clean,'text/html').body;
 const lines=[];let cur='';
 const flush=()=>{if(cur.trim())lines.push(cur.replace(/\s+$/,''));cur='';};
 const walk=(n,depth)=>n.childNodes.forEach(ch=>{
   if(ch.nodeType===3){cur+=ch.textContent.replace(/\s+/g,' ');return;}
   const t=ch.tagName;
   if(t==='BR'){flush();return;}
   if(t==='LI'){flush();const ol=ch.parentNode.tagName==='OL';cur='  '.repeat(depth)+(ol?([...ch.parentNode.children].indexOf(ch)+1)+'. ':'• ');walk(ch,depth+1);flush();return;}
   const block=/^(P|DIV|H3|H4|BLOCKQUOTE|PRE|UL|OL)$/.test(t);
   if(block)flush();walk(ch,depth);if(block)flush();
 });
 walk(body,0);flush();
 return lines.join('\n').trim();
}
const MW_RTE_TOOLS=[['bold','B','Bold (Ctrl+B)'],['italic','I','Italic (Ctrl+I)'],['underline','U','Underline (Ctrl+U)'],['strikeThrough','S','Strikethrough'],['h','H','Heading'],['insertUnorderedList','•','Bulleted list'],['insertOrderedList','1.','Numbered list'],['quote','❝','Quote'],['code','</>','Code / log block'],['removeFormat','✕','Clear formatting']];
function mwRteHTML(key,html,ph,big){
 return `<div class="rte ${big?'rte-big':''}"><div class="rte-bar">${MW_RTE_TOOLS.map(t=>`<button type="button" data-rcmd="${t[0]}" title="${t[2]}">${esc(t[1])}</button>`).join('')}</div><div class="rte-ed ${mwPlain(html)?'':'is-empty'}" contenteditable="true" data-rte="${key}" data-ph="${esc(ph)}">${mwSanitize(html)}</div></div>`;
}
function mwInBlock(ed,tag){const s=window.getSelection();let n=s&&s.anchorNode;while(n&&n!==ed){if(n.nodeType===1&&n.tagName===tag)return true;n=n.parentNode;}return false;}
function wireRte(root,onEdit){
 root.querySelectorAll('.rte').forEach(box=>{
   const ed=box.querySelector('.rte-ed');
   const sync=()=>{ed.classList.toggle('is-empty',!ed.textContent.trim()&&!ed.querySelector('li'));if(onEdit)onEdit();};
   box.querySelectorAll('[data-rcmd]').forEach(b=>{
     b.onmousedown=e=>e.preventDefault(); // keep the editor's selection while clicking the toolbar
     b.onclick=()=>{
       ed.focus();const c=b.dataset.rcmd,blk={h:'H4',quote:'BLOCKQUOTE',code:'PRE'}[c];
       if(blk)document.execCommand('formatBlock',false,mwInBlock(ed,blk)?'<p>':'<'+blk.toLowerCase()+'>');
       else document.execCommand(c,false,null);
       sync();
     };
   });
   ed.addEventListener('input',sync);
   ed.addEventListener('paste',e=>{
     e.preventDefault();
     const html=e.clipboardData.getData('text/html');
     if(html)document.execCommand('insertHTML',false,mwSanitize(html));
     else document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));
   });
 });
}
function rteValue(root,key){const ed=root.querySelector(`[data-rte="${key}"]`);return ed?mwSanitize(ed.innerHTML):'';}
async function mwCopy(text,html){
 try{
   if(html&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write)
     await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);
   else await navigator.clipboard.writeText(text);
   toast('Copied to clipboard');
 }catch(err){
   const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
   try{document.execCommand('copy');toast('Copied to clipboard');}catch(e){toast('Copy failed');}
   ta.remove();
 }
}

 return `<div class="mw-sec-h">Compare recent weeks</div><div class="sub" style="margin:0 0 8px">Activities per category (✓ = completed). Click a week to open it.</div><div class="mw-table-wrap">${table}</div><div class="mw-sec-h">All weeks (${weeks.length})</div>${list}`;

function mwHi(text,qv){const t=esc(text),qe=esc(qv).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return qe?t.replace(new RegExp(qe,'gi'),m=>`<mark>${m}</mark>`):t;}
/* the text around the first match in any of the entry's written fields */
function mwSnippet(e,qv){
 for(const k of ['description',...MW_FIELDS.map(f=>f[0])]){
   const t=mwPlain(e[k]),i=t.toLowerCase().indexOf(qv);
   if(i>=0){const s=Math.max(0,i-70),end=Math.min(t.length,i+qv.length+100);return (s?'…':'')+t.slice(s,end)+(end<t.length?'…':'');}
 }
 return '';
}

 return `<div class="sub" style="margin:0 0 12px">${hits.length} ${hits.length===1?'activity':'activities'} matching “${esc(mwUI.q.trim())}” across ${weeks.length} ${weeks.length===1?'week':'weeks'}</div>

 body.addEventListener('input',dirty);body.addEventListener('change',dirty);

/* ---- stand-up summary: every entry of the week lands in exactly one status bucket, so none can be dropped ---- */
const MW_SU_SECTIONS=[
 ['done','Activities completed',e=>({lead:mwSuTitle(e)})],
 ['prog','Activities in progress',e=>({lead:mwSuTitle(e)})],
 ['pend','Pending activities',e=>({lead:mwSuTitle(e)})],
 ['outcomes','Key outcomes & achievements',e=>({lead:mwSuTitle(e),detail:mwToText(e.outcome)})],
 ['findings','Technical findings',e=>({lead:mwSuTitle(e),detail:mwToText(e.findings)})],
 ['blockers','Blockers & challenges',e=>({lead:mwSuTitle(e)+(mwStatusOf(e)==='Blocked'?' (blocked)':''),detail:mwToText(e.challenges)})],
 ['next','Planned next steps',e=>({lead:({'In Progress':'Continue: ','Pending':'Start: ','Blocked':'Resolve blocker: '}[mwStatusOf(e)]||'')+mwSuTitle(e)})],
];
const MW_SU_BUCKETS=['done','prog','pend','blocked'];
function mwStandupData(wk){
 return mwEntryCats(wk).map((cid,idx)=>{
   const es=wk.entries.filter(e=>e.categoryId===cid).sort(mwSortEntries),by=s=>es.filter(e=>mwStatusOf(e)===s);
   return {idx,cat:mwCat(cid),selected:wk.categoryIds.includes(cid),es,c:mwCounts(es),
     done:by('Completed'),prog:by('In Progress'),pend:by('Pending'),blocked:by('Blocked'),
     outcomes:es.filter(e=>mwPlain(e.outcome)),findings:es.filter(e=>mwPlain(e.findings)),
     blockers:es.filter(e=>mwStatusOf(e)==='Blocked'||mwPlain(e.challenges)),next:es.filter(e=>mwStatusOf(e)!=='Completed')};
 });
}
function mwStandupGroupText(g){
 const L=[`■ ${g.cat.name} — ${mwCountsLine(g.c)}`];
 if(!g.es.length){L.push('    No activities recorded this week.');return L;}
 MW_SU_SECTIONS.forEach(([k,label,fmt])=>{
   if(!g[k].length)return;
   L.push(`  ${label}:`);
   g[k].forEach(e=>{const it=fmt(e);L.push(`    • ${it.lead}`);if(it.detail)it.detail.split('\n').forEach(line=>L.push('        '+line));});
 });
 return L;
}
function mwStandupGroupHTML(g,forCopy,w){
 if(forCopy){
   const secs=g.es.length?MW_SU_SECTIONS.filter(s=>g[s[0]].length).map(([k,label,fmt])=>`<p><b>${label}</b></p><ul>${g[k].map(e=>{const it=fmt(e);return `<li>${esc(it.lead)}${it.detail?'<br>'+esc(it.detail).replace(/\n/g,'<br>'):''}</li>`;}).join('')}</ul>`).join(''):'<p>No activities recorded this week.</p>';
   return `<h3>${esc(g.cat.name)}</h3><p><i>${esc(mwCountsLine(g.c))}</i></p>${secs}`;
 }
 const secs=g.es.length?MW_SU_SECTIONS.filter(s=>g[s[0]].length).map(([k,label,fmt])=>`<div class="mw-su-sec"><div class="mw-sec-h">${label} (${g[k].length})</div><ul>${g[k].map(e=>{const it=fmt(e);return `<li>${esc(it.lead)} <button class="mw-link" data-mwsview="${e.id}">view</button>${it.detail?`<div class="mw-snip">${esc(it.detail)}</div>`:''}</li>`;}).join('')}</ul></div>`).join(''):'<div class="mw-snip" style="color:var(--ink-3)">No activities recorded this week.</div>';
 return `<div class="mw-su-h"><span class="mw-ic sm" style="background:${tint(g.cat.color)};color:${g.cat.color}">${svg(g.cat.icon,15)}</span><b>${esc(g.cat.name)}${g.selected?'':' <small style="color:var(--ink-3);font-weight:600">(removed from week)</small>'}</b><button class="btn sm" data-mwscopy="${g.idx}">Copy</button></div><div class="mw-em" style="margin:-4px 0 4px">${mwCountsLine(g.c)}</div>${secs}`;
}
async function mwStandupModal(w,mode){
 w=w||mwWeekOf(todayStr());mode=mode||'preview';
 await mwLoadCats();
 const wk=await mwGetWeek(w),groups=mwStandupData(wk);
 const placed=new Set();groups.forEach(g=>MW_SU_BUCKETS.forEach(k=>g[k].forEach(e=>placed.add(e.id))));
 const total=wk.entries.length,missing=wk.entries.filter(e=>!placed.has(e.id));
 const cover=!total?'':missing.length
   ?`<div class="mw-cover bad">⚠ ${missing.length} of ${total} activities could not be placed: ${missing.map(e=>esc(e.title)).join(', ')}</div>`
   :`<div class="mw-cover ok">✓ All ${total} recorded ${total===1?'activity is':'activities are'} included, across ${groups.length} ${groups.length===1?'category':'categories'}.</div>`;
 const heading=`Stand-up summary — Week ${mwWeekNo(w)} (${mwWeekLabel(w)})`;
 const text=[heading.toUpperCase(),'',...groups.flatMap(g=>[...mwStandupGroupText(g),''])].join('\n').trim();
 const html=`<h2>${esc(heading)}</h2>${groups.map(g=>mwStandupGroupHTML(g,true)).join('')}`;
 openModal('Stand-up summary',`
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
   <div class="datenav"><button id="su-prev" title="Previous week">‹</button><div class="mw-wl"><b>${mwWeekLabel(w)}</b><span>Week ${mwWeekNo(w)}</span></div><button id="su-next" title="Next week">›</button></div>
   <div class="tabs" style="margin-left:auto"><button class="${mode==='preview'?'on':''}" data-sumode="preview">Organized</button><button class="${mode==='text'?'on':''}" data-sumode="text">Plain text</button></div>
  </div>
  <p class="sub" style="margin:0 0 12px">Collected from every category of this week, to help you update your existing stand-up presentation. Use <b>view</b> to inspect an original entry.</p>
  ${!groups.length?'<div class="empty">Nothing recorded for this week yet.</div>':cover+(mode==='text'?`<textarea class="mw-plain" readonly>${esc(text)}</textarea>`:groups.map(g=>`<div class="mw-su-cat">${mwStandupGroupHTML(g,false)}</div>`).join(''))}`,
  `<button class="btn" data-close>Close</button><button class="btn primary" id="su-copy" ${groups.length?'':'disabled'}>Copy all</button>`,'wide');
 q('#su-prev').onclick=()=>mwStandupModal(addDays(w,-7),mode);
 q('#su-next').onclick=()=>mwStandupModal(addDays(w,7),mode);
 overlay.querySelectorAll('[data-sumode]').forEach(b=>b.onclick=()=>mwStandupModal(w,b.dataset.sumode));
 q('#su-copy').onclick=()=>mwCopy(text,html);
 overlay.querySelectorAll('[data-mwscopy]').forEach(b=>b.onclick=()=>{const g=groups[+b.dataset.mwscopy];mwCopy(mwStandupGroupText(g).join('\n'),mwStandupGroupHTML(g,true));});
 overlay.querySelectorAll('[data-mwsview]').forEach(b=>b.onclick=()=>mwEntryViewModal(w,b.dataset.mwsview,()=>mwStandupModal(w,mode)));
}

  <div class="field"><label>Description</label><textarea id="wt-desc" placeholder="Optional details...">${esc(base.description||'')}</textarea></div>
  <div class="row2">
   <div class="field"><label>Project</label><select id="wt-proj">${projOpts}</select></div>
   <div class="field"><label>Due date</label><input id="wt-due" type="date" value="${base.dueDate||''}"></div>
  </div>
  <div class="field"><label>Deadline time (optional)</label><input id="wt-duetime" type="time" value="${base.dueTime||''}"></div>
  <div class="row2">
   <div class="field"><label>Priority</label><select id="wt-pri">${['Low','Medium','High','Urgent'].map(p=>`<option ${base.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
   <div class="field" id="wt-statusWrap"><label>Status</label><select id="wt-status">${['Not Started','In Progress','Blocked','Completed'].map(s=>`<option ${base.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
  </div>
  <div class="field" id="wt-progWrap"><label>Progress <span id="wt-progval">${base.progress||0}</span>%</label><input id="wt-prog" type="range" min="0" max="100" step="5" value="${base.progress||0}" style="width:100%"></div>
  ${!tid?`
  <div class="toggle" style="margin-top:0">Share with team <span class="sw" id="wt-sharedSw"></span></div>
  <div class="field" id="wt-teamWrap" style="display:none;margin-top:10px">
   ${!syncEnabled()?'<div class="sub" style="margin-top:0">Log in from Settings to share tasks with a team.</div>':myTeams.length?`<label>Team</label><select id="wt-team">${teamOpts}</select><div class="sub" style="margin:6px 0 0">Each member tracks their own status & progress on this task — set from the task once it's created.</div>`:'<div class="sub" style="margin-top:0">You\'re not in a team yet.</div><button type="button" class="btn sm" id="wt-createTeamInline" style="margin-top:6px">Create or join a team</button>'}
  </div>
  <div class="toggle">Make this a recurring task <span class="sw" id="wt-recurSw"></span></div>
  <div id="wt-recurWrap" style="display:none;margin-top:10px">
   <div class="field"><label>Repeat</label><select id="wt-recurFreq"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="custom">Custom</option></select></div>
   <div class="field" id="wt-recurDaysWrap"><label>On days</label><div class="chips" id="wt-recurDays">${DAYNAMES.map((d,i)=>`<button type="button" class="chip" data-rd="${i}">${d}</button>`).join('')}</div></div>
   <div class="field" id="wt-recurDomWrap" style="display:none"><label>Day of month</label><input id="wt-recurDom" type="number" min="1" max="28" value="1"></div>
   <div class="sub" id="wt-recurSharedHint" style="display:none;margin-top:-4px">New occurrences appear automatically for the whole team — the Due date above is only used for a one-off task.</div>
  </div>
  <div class="toggle">Schedule this task in DayPlan <span class="sw" id="wt-schedSw"></span></div>
  <div id="wt-schedWrap" style="display:none;margin-top:10px">
   <div class="row3">
    <div class="field" id="wt-sDateWrap"><label>Date</label><input id="wt-sDate" type="date" value="${base.dueDate||todayStr()}"></div>
    <div class="field"><label>Start</label><input id="wt-sStart" type="time" value="09:00"></div>
    <div class="field"><label>End</label><input id="wt-sEnd" type="time" value="10:00"></div>
   </div>
   <div class="sub" id="wt-durLabel" style="margin-top:-6px">Duration: 1h</div>
   <div class="sub" id="wt-schedRecurHint" style="display:none;margin-top:2px">This time is added to your own DayPlan automatically every time this task recurs.</div>
  </div>`:''}
  ${isOcc?`<div class="sub" style="margin-top:0">🔁 Part of recurring series: <b>${esc(rt?rt.title:'')}</b>. <button type="button" class="btn sm" id="wt-editSeries" style="margin-left:6px">Edit series</button></div>`:''}
  ${t&&t.schedule&&t.schedule.length?`<div class="sub" style="margin-top:10px">Already scheduled ${t.schedule.length} session(s). Open task details to manage.</div>`:''}
 `;
 const foot=`${tid?'<button class="danger-link" id="wt-del" style="margin-right:auto;background:none;border:none;color:var(--red);font-weight:700;cursor:pointer;font-family:inherit">Delete</button>':''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="wt-save">${tid?'Save changes':'Create task'}</button>`;
 openModal(tid?'Edit task':'New task',body,foot);

 q('#wt-prog').oninput=e=>{q('#wt-progval').textContent=e.target.value;};

 let shared=false,recurOn=false,schedOn=false;
 const sharedSw=q('#wt-sharedSw');
 const recurSw=q('#wt-recurSw');
 const schedSw=q('#wt-schedSw');
 const updateCombinedHints=()=>{
   const hint1=q('#wt-recurSharedHint');if(hint1)hint1.style.display=(shared&&recurOn)?'':'none';
   const hint2=q('#wt-schedRecurHint');if(hint2)hint2.style.display=recurOn?'':'none';
   const sDateWrap=q('#wt-sDateWrap');if(sDateWrap)sDateWrap.style.display=recurOn?'none':'';
 };

 if(sharedSw){
   sharedSw.onclick=e=>{
     shared=!shared;e.target.classList.toggle('on',shared);
     q('#wt-teamWrap').style.display=shared?'':'none';
     q('#wt-statusWrap').style.display=shared?'none':'';
     q('#wt-progWrap').style.display=shared?'none':'';
     updateCombinedHints();
   };
   const inlineTeamBtn=q('#wt-createTeamInline');if(inlineTeamBtn)inlineTeamBtn.onclick=()=>{teamsModal();};
 }
 if(recurSw){
   recurSw.onclick=e=>{recurOn=!recurOn;e.target.classList.toggle('on',recurOn);q('#wt-recurWrap').style.display=recurOn?'':'none';updateCombinedHints();};
   q('#wt-recurFreq').onchange=e=>{const f=e.target.value;q('#wt-recurDaysWrap').style.display=(f==='weekly'||f==='custom')?'':'none';q('#wt-recurDomWrap').style.display=f==='monthly'?'':'none';};
   q('#wt-recurDays').querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 }
 const editSeriesBtn=q('#wt-editSeries');if(editSeriesBtn)editSeriesBtn.onclick=()=>{recurringModal(rt.id);};
 if(schedSw){
   schedSw.onclick=e=>{schedOn=!schedOn;e.target.classList.toggle('on',schedOn);q('#wt-schedWrap').style.display=schedOn?'':'none';};
   const updDur=()=>{const s=q('#wt-sStart').value,en=q('#wt-sEnd').value;q('#wt-durLabel').textContent='Duration: '+(s&&en?durLabel(s,en):'—');};
   q('#wt-sStart').oninput=updDur;q('#wt-sEnd').oninput=updDur;updDur();
 }

 q('#wt-save').onclick=async()=>{
   const title=q('#wt-title').value.trim();
   if(!title){toast('Add a task name');return;}
   const due=q('#wt-due').value;
   if(!due){toast('Pick a due date');return;}
   const description=q('#wt-desc').value.trim();
   const priority=q('#wt-pri').value;
   const dueTime=q('#wt-duetime').value||null;

   if(shared){
     if(!syncEnabled()){toast('Log in from Settings to share tasks with a team');return;}
     const teamSel=q('#wt-team');
     const teamId=teamSel?teamSel.value:'';
     if(!teamId){toast('Pick a team, or create/join one first');return;}
     const projId=q('#wt-proj').value;
     const proj=projId?(pref.workProjects||[]).find(p=>p.id===projId):null;
     const projectName=proj?proj.name:'';
     try{
       if(recurOn&&recurSw){
         const freq=q('#wt-recurFreq').value;
         const days=[...q('#wt-recurDays').querySelectorAll('.on')].map(b=>+b.dataset.rd);
         const schedStart=schedOn?q('#wt-sStart').value:null;
         const schedEnd=schedOn?q('#wt-sEnd').value:null;
         await createSharedRecurringTaskRemote(teamId,{title,description,projectName,priority,freq,days,dayOfMonth:num(q('#wt-recurDom').value)||1,dueTime,schedStart,schedEnd});
         await ensureTeamRecurringSchedules();
         closeModal();render();toast('Recurring shared task created');
       }else{
         const r=await createSharedTaskRemote(teamId,{title,description,projectName,dueDate:due,dueTime,priority});
         if(schedOn){
           const start=q('#wt-sStart').value,end=q('#wt-sEnd').value;
           if(start&&end)await scheduleTaskToDayPlan({id:r.id,title},due,start,end);
         }
         closeModal();render();toast('Shared task created');
       }
     }catch(e){toast(e.message);}
     return;
   }

   const obj={
     ...base,id:base.id||id(),title,description,
     projectId:q('#wt-proj').value||'',dueDate:due,dueTime,
     priority,status:q('#wt-status').value,
     progress:q('#wt-status').value==='Completed'?100:num(q('#wt-prog').value),
     schedule:base.schedule||[],comments:base.comments||[],history:base.history||[],
     createdAt:base.createdAt||Date.now()
   };
   if(obj.status==='Completed')obj.completedAt=todayStr();else delete obj.completedAt;
   pref.workTasks=pref.workTasks||[];
   const isNew=!tid;
   if(tid)pref.workTasks=pref.workTasks.map(x=>x.id===tid?obj:x);
   else pref.workTasks.push(obj);
   pushTaskHistory(obj,isNew?'Task created':'Task updated');

   if(recurOn&&recurSw){
     const freq=q('#wt-recurFreq').value;
     const days=[...q('#wt-recurDays').querySelectorAll('.on')].map(b=>+b.dataset.rd);
     const rtObj={id:id(),title:obj.title,description:obj.description,projectId:obj.projectId,priority:obj.priority,
       freq,days,dayOfMonth:num(q('#wt-recurDom').value)||1,time:dueTime||'09:00',
       shared:false,assignees:[],createdAt:Date.now()};
     pref.recurringTasks=pref.recurringTasks||[];pref.recurringTasks.push(rtObj);
     obj.recurringId=rtObj.id;obj.occurrenceDate=obj.dueDate;
   }

   if(schedOn){
     const date=recurOn?obj.dueDate:(q('#wt-sDate').value||obj.dueDate),start=q('#wt-sStart').value,end=q('#wt-sEnd').value;
     if(date&&start&&end)await scheduleTaskToDayPlan(obj,date,start,end);
   }

   queueSave();closeModal();render();toast(isNew?'Task created':'Task saved');
 };
 const del=q('#wt-del');if(del)del.onclick=()=>{if(t)skipOccurrenceIfDeleted(t);pref.workTasks=pref.workTasks.filter(x=>x.id!==tid);queueSave();render();closeModal();};
}

 const body=`

   <span class="status-badge st-${slug(t.status)}">${t.status}</span>

  ${t.description?`<p class="sub" style="margin:6px 0 14px">${esc(t.description)}</p>`:''}
  <div class="row2">

   <div class="field"><label>Due date</label><div style="font-weight:700;font-size:13.5px">${t.dueDate?dateLabel(t.dueDate):'No due date'}${t.dueTime?' <span style="color:var(--ink-3);font-weight:600;font-size:12px">· by '+fmt12(t.dueTime)+'</span>':''}</div></div>

   ${(t.schedule||[]).length?t.schedule.map(s=>`<div class="wsched-item"><div class="wsched-time">${fmt12(s.start)}<br>${fmt12(s.end)}</div><div style="flex:1"><div class="wsched-title">${dateLabel(s.date)}</div></div><button class="btn sm" data-wgoto="${s.date}">Go to Today Plan</button></div>`).join(''):'<div class="empty">No sessions scheduled yet.</div>'}
   <button type="button" class="btn primary sm full" id="wt-addSched" style="margin-top:8px">${svg('plus',14)} Add to DayPlan</button>
   <div id="wt-schedAddWrap" style="display:none;margin-top:10px">
    <div class="row3"><div class="field"><label>Date</label><input id="wt-adDate" type="date" value="${t.dueDate||todayStr()}"></div><div class="field"><label>Start</label><input id="wt-adStart" type="time" value="09:00"></div><div class="field"><label>End</label><input id="wt-adEnd" type="time" value="10:00"></div></div>
    <button type="button" class="btn primary sm" id="wt-adConfirm">Add</button>
   </div>

   <div id="wt-comments">${(t.comments||[]).length?t.comments.map(c=>`<div class="wcomment"><b>${esc(c.author)}</b><span class="wc-time">${new Date(c.ts).toLocaleString()}</span><div>${esc(c.text)}</div></div>`).join(''):'<div class="empty">No comments yet.</div>'}</div>
   <div style="display:flex;gap:8px;margin-top:8px"><input id="wt-newComment" placeholder="Add a comment..." style="flex:1"><button type="button" class="btn sm" id="wt-addComment">Post</button></div>
  </div>
  <div class="field"><label>Activity history</label>
   <div class="wt-history">${(t.history||[]).slice().reverse().map(h=>`<div class="wh-row"><span class="wh-time">${new Date(h.ts).toLocaleDateString()}</span><span>${esc(h.text)}</span></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>
  </div>
 `;
 const foot=`<button class="btn" id="wt-editBtn">${svg('edit',15)} Edit task</button><button class="btn" data-close>Close</button>`;
 openModal(esc(t.title),body,foot);
 overlay.querySelector('.modal').style.maxWidth='620px';
 q('#wt-editBtn').onclick=()=>{taskModal(tid);};
 q('#wt-addSched').onclick=()=>{q('#wt-schedAddWrap').style.display='block';};
 q('#wt-adConfirm').onclick=async()=>{
   const date=q('#wt-adDate').value,start=q('#wt-adStart').value,end=q('#wt-adEnd').value;
   if(!date||!start||!end){toast('Fill date, start & end');return;}
   await scheduleTaskToDayPlan(t,date,start,end);queueSave();render();taskDetailModal(tid);toast('Added to DayPlan');
 };
 q('#wt-addComment').onclick=()=>{
   const val=q('#wt-newComment').value.trim();if(!val)return;

   pushTaskHistory(t,'Comment added');queueSave();taskDetailModal(tid);
 };
 overlay.querySelectorAll('[data-wgoto]').forEach(b=>b.onclick=()=>{closeModal();loadDay(b.dataset.wgoto);setView('today');});
}

function teamTaskDetailModal(teamId,taskId){
 const t=findSharedTask(teamId,taskId);if(!t)return;
 const team=myTeams.find(x=>x.id===teamId);
 const myEmail=account?account.email:null;
 const myStatus=myEmail?(t.statuses[myEmail]||'Not Started'):'Not Started';
 const body=`
  <div class="sub" style="margin-top:0">👥 ${esc(team?team.name:'Team')}</div>
  ${t.description?`<p class="sub" style="margin:6px 0 14px">${esc(t.description)}</p>`:''}
  <div class="row2">
   <div class="field"><label>Due date</label><div style="font-weight:700;font-size:13.5px">${t.dueDate?dateLabel(t.dueDate):'No due date'}${t.dueTime?' <span style="color:var(--ink-3);font-weight:600;font-size:12px">· by '+fmt12(t.dueTime)+'</span>':''}</div></div>
   <div class="field"><label>Priority</label><span class="pri-badge pri-${t.priority}">${t.priority}</span></div>
  </div>
  ${t.projectName?`<div class="field"><label>Project</label><span class="wchip" style="background:var(--bg);color:var(--ink-2)">${esc(t.projectName)}</span></div>`:''}
  <div class="field"><label>Your status</label>
   <div class="chips">${['Not Started','In Progress','Completed'].map(s=>`<button type="button" class="chip ${myStatus===s?'on':''}" data-mystatus="${s}">${s}</button>`).join('')}</div>
  </div>
  <div class="field"><label>Team progress</label>${teamProgressServerHTML(teamId,t)}</div>
  <div class="field"><label>Comments (${(t.comments||[]).length})</label>
   <div id="wt-comments">${(t.comments||[]).length?t.comments.map(c=>`<div class="wcomment"><b>${esc(emailName(c.email))}</b><span class="wc-time">${new Date(c.createdAt).toLocaleString()}</span><div>${esc(c.text)}</div></div>`).join(''):'<div class="empty">No comments yet.</div>'}</div>
   <div style="display:flex;gap:8px;margin-top:8px"><input id="wt-newComment" placeholder="Add a comment..." style="flex:1"><button type="button" class="btn sm" id="wt-addComment">Post</button></div>
  </div>
 `;
 const foot=`<button class="btn" id="wt-editBtn">${svg('edit',15)} Edit</button><button class="btn" data-close>Close</button>`;
 openModal(esc(t.title),body,foot);
 overlay.querySelector('.modal').style.maxWidth='620px';
 // these awaits can take a few seconds (cross-region DB round trips); if the user has since closed
 // this modal or opened a different one, overlay no longer contains [data-mystatus] — don't blindly
 // reopen this detail modal on top of whatever they're looking at now
 const stillOpen=()=>!!overlay.querySelector('[data-mystatus]');
 overlay.querySelectorAll('[data-mystatus]').forEach(b=>b.onclick=async()=>{
   try{await setSharedTaskStatusRemote(teamId,taskId,b.dataset.mystatus);render();if(stillOpen())teamTaskDetailModal(teamId,taskId);}catch(e){toast(e.message);}
 });
 overlay.querySelectorAll('[data-wteamstatus]').forEach(b=>b.onclick=async()=>{
   const[teamId2,taskId2]=b.dataset.wteamstatus.split('|');
   try{await cycleMyTeamStatus(teamId2,taskId2);render();if(stillOpen())teamTaskDetailModal(teamId,taskId);}catch(e){toast(e.message);}
 });
 q('#wt-editBtn').onclick=()=>{editSharedTaskModal(teamId,taskId);};
 q('#wt-addComment').onclick=async()=>{
   const val=q('#wt-newComment').value.trim();if(!val)return;
   try{await addSharedCommentRemote(teamId,taskId,val);render();if(stillOpen())teamTaskDetailModal(teamId,taskId);}catch(e){toast(e.message);}
 };
}

 }else{

     authBusy=null;

     if(kind==='signup')await DB.delete(PENDING_NAME_KEY);
     const msg=err.status===409?'An account with that email already exists — use Log in instead.':err.status===429?'Too many attempts — wait a few minutes and try again.':err.message;
     const e2=document.getElementById('acc-err');
     if(e2){e2.textContent=msg;e2.style.display='block';}else toast(msg);
   };

   el.querySelector('#acc-pass').onkeydown=e=>{if(e.key==='Enter')runAuth(authMode);};
 }
}
function wireSleep(el){const sv=el.querySelector('#saveSleep');if(sv)sv.onclick=()=>{pref.wakeTime=el.querySelector('#wakeT').value||'07:00';pref.sleepHours=num(el.querySelector('#sleepH').value)||8;queueSave();render();toast('Sleep plan saved');};}

/* ============ Focus Mode ============ */
function startFocus(aid){
 const acts=(day.activities||[]).filter(a=>a.status==='pending').sort((a,b)=>toMin(a.start)-toMin(b.start));
 if(!aid){
   if(!acts.length){toast('No pending activities to focus on');return;}
   // pick current/next
   const n=nowMin();aid=(acts.find(a=>{const[s,e]=interval(a);return n>=s&&n<e;})||acts[0]).id;
 }
 const a=day.activities.find(x=>x.id===aid);const mins=(pref.focusLen||60);
 focusState={aid,total:mins*60,left:mins*60,running:true};
 renderFocus();document.getElementById('focusScreen').classList.add('show');
 clearInterval(focusTimer);focusTimer=setInterval(tickFocus,1000);
}
function tickFocus(){if(!focusState)return;if(focusState.running){focusState.left--;if(focusState.left<=0){completeFocus();return;}renderFocus();}}
function renderFocus(){
 const scr=document.getElementById('focusScreen');const a=day.activities.find(x=>x.id===focusState.aid);
 const acts=[...day.activities].sort((x,y)=>toMin(x.start)-toMin(y.start));const idx=acts.findIndex(x=>x.id===a.id);const next=acts[idx+1];
 const mm=String(Math.floor(focusState.left/60)).padStart(2,'0'),ss=String(focusState.left%60).padStart(2,'0');
 const pct=1-focusState.left/focusState.total;const C=2*Math.PI*112;
 scr.innerHTML=`<div class="ftask">Now focusing</div><div class="ftitle">${esc(a.title)}</div>
  <div class="ftimer"><svg width="250" height="250"><circle cx="125" cy="125" r="112" stroke="rgba(255,255,255,.12)" stroke-width="10" fill="none"/><circle cx="125" cy="125" r="112" stroke="#22c55e" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><div class="fnum">${mm}:${ss}</div></div>
  <div class="fnext">${next?'Next: '+esc(next.title)+' · '+fmt12(next.start):'Last activity of the day'}</div>
  <div class="fctrls"><button class="btn" id="fPause">${svg(focusState.running?'pause':'play','16')} ${focusState.running?'Pause':'Resume'}</button><button class="btn" id="fSkip">Skip</button><button class="btn primary" id="fDone">${svg('check',16)} Complete</button><button class="btn" id="fExit">Exit</button></div>`;
 scr.querySelector('#fPause').onclick=()=>{focusState.running=!focusState.running;renderFocus();};
 scr.querySelector('#fSkip').onclick=()=>{a.status='skipped';exitFocus();queueSave();render();};
 scr.querySelector('#fDone').onclick=completeFocus;
 scr.querySelector('#fExit').onclick=()=>{addFocusTime();exitFocus();};
}
function addFocusTime(){if(!focusState)return;const spent=Math.round((focusState.total-focusState.left)/60);day.focusMin=(day.focusMin||0)+Math.max(0,spent);}
function completeFocus(){const a=day.activities.find(x=>x.id===focusState.aid);a.status='done';syncGoalFromActivity(a);addFocusTime();exitFocus();queueSave();render();toast('Nice — activity complete ✅');}
function exitFocus(){clearInterval(focusTimer);focusState=null;document.getElementById('focusScreen').classList.remove('show');}

/* ============ End-of-day review ============ */
function reviewModal(){
 const st=dayStats(day);const r=day.review||{};
 openModal('End-of-Day Review',`<div class="sub" style="margin-top:0">${dateLabel(dayStr)} · ${st.done}/${st.total} done · ${st.adherence}% adherence</div>
  <div class="field"><label>✅ What did you complete?</label><textarea id="r-c">${esc(r.completed||'')}</textarea></div>
  <div class="field"><label>⏭️ What was skipped?</label><textarea id="r-s">${esc(r.skipped||'')}</textarea></div>
  <div class="field"><label>📵 What distracted you?</label><textarea id="r-d">${esc(r.distracted||'')}</textarea></div>
  <div class="field"><label>💡 What did you learn today?</label><textarea id="r-l">${esc(r.learned||'')}</textarea></div>
  <div class="toggle" style="margin-top:0">Carry unfinished tasks to tomorrow <span class="sw ${r.carry?'on':''}" id="carrySw"></span></div>`,
  `<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveReview">Save & score my day</button>`);
 let carry=!!r.carry;q('#carrySw').onclick=e=>{carry=!carry;e.target.classList.toggle('on',carry);};
 q('#saveReview').onclick=async()=>{
   const score=Math.round(st.adherence*0.7+Math.min(30,(day.focusMin||0)/((pref.focusGoalH||4)*60)*30));
   day.review={completed:q('#r-c').value,skipped:q('#r-s').value,distracted:q('#r-d').value,learned:q('#r-l').value,carry,score};
   if(carry){const nd=addDays(dayStr,1);let td=await DB.get(dayKey(nd));if(!td)td={planned:false,activities:generateActivities(nd),priorities:[],focusMin:0,screenMin:0};(day.activities||[]).filter(a=>a.status==='pending').forEach(a=>td.activities.push({...a,id:id(),status:'pending'}));await DB.set(dayKey(nd),td);}
   queueSave();closeModal();render();toast('Day scored: '+day.review.score+'/100 '+(carry?'· tasks carried over':''));
 };
}

const overlay=document.getElementById('overlay');const q=s=>overlay.querySelector(s);
/* overlay.dataset.guard='1' marks a modal holding unsaved writing (the My Work entry editor) — Esc and
   backdrop clicks then refuse to close it, so only its explicit Save / Discard buttons can */
function openModal(t,b,f,cls){overlay.dataset.guard='';overlay.innerHTML=`<div class="modal ${cls||''}"><div class="modal-head"><h3>${t}</h3><button class="close-x" data-close><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body">${b}</div><div class="modal-foot">${f||''}</div></div>`;overlay.classList.add('show');const el=overlay.querySelector('input,textarea,select');if(el)setTimeout(()=>el.focus(),60);}
function closeModal(){overlay.dataset.guard='';overlay.classList.remove('show');setTimeout(()=>{if(!overlay.classList.contains('show'))overlay.innerHTML='';},180);}
function guardedClose(){if(overlay.dataset.guard==='1'&&overlay.classList.contains('show')){toast('Unsaved changes — use Save or Discard');return;}closeModal();}
overlay.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal();else if(e.target===overlay)guardedClose();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(focusState)exitFocus();else guardedClose();}});

  <div class="field"><label>Current milestone (optional)</label><input id="g-mile" value="${esc(g.milestone||'')}" placeholder="e.g. Finished chapter 5"></div>
  <div class="field"><label>Icon</label>${iconPicker(g.icon)}</div>
  <div class="field"><label>Colour</label><div class="chips">${ACT_COLORS.map(c=>`<button type="button" class="cpick" data-c="${c}" style="width:30px;height:30px;border-radius:8px;background:${c};border:2px solid ${c===g.color?'var(--ink)':'transparent'}"></button>`).join('')}</div></div>`,
  `${gid?'<button class="danger-link" id="g-del" style="margin-right:auto;background:none;border:none;color:var(--red);font-weight:700;cursor:pointer;font-family:inherit">Delete</button>':''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="g-save">Save</button>`);
 wireIconPicker();let color=g.color;overlay.querySelectorAll('.cpick').forEach(b=>b.onclick=()=>{color=b.dataset.c;overlay.querySelectorAll('.cpick').forEach(x=>x.style.borderColor='transparent');b.style.borderColor='var(--ink)';});
 q('#g-save').onclick=()=>{const name=q('#g-name').value.trim();if(!name){toast('Name the goal');return;}const obj={id:gid||id(),name,current:num(q('#g-cur').value),target:num(q('#g-tgt').value),unit:q('#g-unit').value.trim(),category:q('#g-cat').value,targetDate:q('#g-date').value||'',milestone:q('#g-mile').value.trim(),color,icon:pickedIcon()};pref.goals=pref.goals||[];if(gid)pref.goals=pref.goals.map(x=>x.id===gid?obj:x);else pref.goals.push(obj);queueSave();render();closeModal();};
 const del=q('#g-del');if(del)del.onclick=()=>{pref.goals=pref.goals.filter(x=>x.id!==gid);queueSave();render();closeModal();};
}
function habitModal(hid){
 const h=hid?pref.habits.find(x=>x.id===hid):{name:'',icon:'check',goalId:null,color:ACT_COLORS[1],desc:'',goalText:'',category:HABIT_CATEGORIES[0]};
 const goalOpts=`<option value="">— none —</option>`+(pref.goals||[]).map(g=>`<option value="${g.id}" ${h.goalId===g.id?'selected':''}>${esc(g.name)}</option>`).join('');
 openModal(hid?'Edit habit':'Add habit',`<div class="field"><label>Habit</label><input id="h-name" value="${esc(h.name)}" placeholder="e.g. Drink 2L water"></div>
  <div class="field"><label>Short description (optional)</label><input id="h-desc" value="${esc(h.desc||'')}" placeholder="e.g. Stay hydrated"></div>
  <div class="field"><label>Daily goal (optional)</label><input id="h-goaltext" value="${esc(h.goalText||'')}" placeholder="e.g. Read 30 minutes"></div>
  <div class="row2"><div class="field"><label>Category</label><select id="h-cat">${HABIT_CATEGORIES.map(c=>`<option value="${c}" ${h.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Link to goal (optional)</label><select id="h-goal">${goalOpts}</select></div></div>
  <div class="field"><label>Icon</label>${iconPicker(h.icon)}</div>
  <div class="field"><label>Colour</label><div class="chips">${ACT_COLORS.map(c=>`<button type="button" class="cpick" data-c="${c}" style="width:30px;height:30px;border-radius:8px;background:${c};border:2px solid ${c===h.color?'var(--ink)':'transparent'}"></button>`).join('')}</div></div>`,
  `${hid?'<button class="danger-link" id="h-del" style="margin-right:auto;background:none;border:none;color:var(--red);font-weight:700;cursor:pointer;font-family:inherit">Delete</button>':''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="h-save">Save</button>`);
 wireIconPicker();let hcolor=h.color||ACT_COLORS[1];overlay.querySelectorAll('.cpick').forEach(b=>b.onclick=()=>{hcolor=b.dataset.c;overlay.querySelectorAll('.cpick').forEach(x=>x.style.borderColor='transparent');b.style.borderColor='var(--ink)';});
 q('#h-save').onclick=()=>{const name=q('#h-name').value.trim();if(!name){toast('Name the habit');return;}const goalId=q('#h-goal').value||null;const fields={name,icon:pickedIcon(),goalId,color:hcolor,desc:q('#h-desc').value.trim(),goalText:q('#h-goaltext').value.trim(),category:q('#h-cat').value};pref.habits=pref.habits||[];if(hid)pref.habits=pref.habits.map(x=>x.id===hid?{...x,...fields}:x);else pref.habits.push({id:id(),history:{},...fields});queueSave();render();closeModal();};
 const del=q('#h-del');if(del)del.onclick=()=>{pref.habits=pref.habits.filter(x=>x.id!==hid);queueSave();render();closeModal();};
}
function screenModal(){
 openModal('Log screen time',`<div class="field"><label>Phone/screen time today (minutes)</label><input id="sc" inputmode="numeric" value="${day.screenMin||0}"></div><div class="sub">Target: ${(pref.phoneTarget/60).toFixed(0)}h/day.</div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="scSave">Save</button>`);
 q('#scSave').onclick=()=>{day.screenMin=Math.round(num(q('#sc').value));queueSave();render();closeModal();};
}

/* ============ Notifications (while open) ============ */
setInterval(()=>{
 if(!pref||!pref.notify||dayStr!==todayStr()||!window.Notification||Notification.permission!=='granted')return;
 const n=nowMin();(day.activities||[]).forEach(a=>{if(a.status!=='pending')return;const s=toMin(a.start);if(s-n===5&&!a._notified){a._notified=true;new Notification('Starting soon: '+a.title,{body:fmt12(a.start)+' – '+fmt12(a.end)});}});
},30000);

setInterval(()=>{positionNowMarker();updateNowActive();},30000);
window.addEventListener('resize',()=>positionNowMarker());

/* ============ Seed & init ============ */
function defaultTemplates(){
 const T=(title,icon,color,start,end,recur,days)=>({id:id(),title,icon,color,start,end,recur,days:days||[],goalId:null});
 return [
  T('Wake Up & Morning Routine','sun','#f59e0b','07:00','07:30','daily'),
  T('Exercise','run','#ec4899','07:30','08:15','daily'),
  T('Breakfast','coffee','#14b8a6','08:15','08:45','daily'),
  T('Deep Work','work','#f97316','09:00','12:30','weekday'),
  T('Lunch Break','coffee','#14b8a6','12:30','13:30','daily'),
  T('Focused Work','work','#f97316','13:30','17:00','weekday'),
  T('Personal Time','smile','#3b82f6','18:00','19:00','daily'),
  T('Reading','book','#6366f1','21:00','21:30','daily'),
  T('Wind Down','moon','#8b5cf6','22:30','23:00','daily'),
  T('Sleep','bed','#6366f1','23:00','07:00','daily'),
 ];
}
async function init(){
 buildNav();
 pref=await DB.get(PREF);
 if(!pref){
   pref={name:'',dark:false,wakeTime:'07:00',sleepHours:8,phoneTarget:120,focusLen:60,focusGoalH:4,noPhoneSleep:true,notify:false,
     templates:defaultTemplates(),
     goals:[
       {id:id(),name:'Read 20 Books',current:0,target:20,unit:'books',color:'#3b82f6',icon:'book'},
       {id:id(),name:'Learn New Skills',current:0,target:100,unit:'',color:'#8b5cf6',icon:'brain'},
       {id:id(),name:'Fitness 5 Days/Week',current:0,target:100,unit:'',color:'#22c55e',icon:'dumbbell'},
       {id:id(),name:'Save ₹50,000',current:0,target:50000,unit:'',color:'#f59e0b',icon:'goal'},
     ],
     habits:[
       {id:id(),name:'Exercise',icon:'run',history:{}},
       {id:id(),name:'Read',icon:'book',history:{}},
       {id:id(),name:'English Learning',icon:'en',history:{}},
       {id:id(),name:'No Phone before Sleep',icon:'moon',history:{}},
       {id:id(),name:'Drink 2L Water',icon:'water',history:{}},
     ]};
   pref.workProjects=[];pref.workTasks=[];pref.recurringTasks=[];
   // real first day — nothing pre-filled or auto-completed; every activity starts pending until the user acts on it
   const today=todayStr();
   dayStr=today;
   day={planned:false,activities:generateActivities(today),priorities:[],focusMin:0,screenMin:0,review:null};
   await DB.set(dayKey(today),day);
   await DB.set(PREF,pref);
 }else{
   dayStr=pref.lastDay&&pref.lastDay>=addDays(todayStr(),-30)?pref.lastDay:todayStr();
   day=await DB.get(dayKey(dayStr));
   if(!day)day={planned:false,activities:generateActivities(dayStr),priorities:[],focusMin:0,screenMin:0,review:null};
 }
 applyDark();
 setView('today');
 const pendingName=await DB.get(PENDING_NAME_KEY);
 if(pendingName){if(!pref.name){pref.name=pendingName;queueSave();render();}await DB.delete(PENDING_NAME_KEY);}
 wakeSyncServer();
 account=await DB.get(ACCOUNT_KEY);
 if(account&&account.email&&!await DB.get(OWNER_KEY))await DB.set(OWNER_KEY,String(account.email).toLowerCase());
 if(syncEnabled())syncNow();
}
init();
</script>
