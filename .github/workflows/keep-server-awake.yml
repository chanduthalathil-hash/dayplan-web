# Render's free plan puts dayplan-server to sleep after ~15 idle minutes, and the first
# request after that waits up to a minute for it to boot (slow logins, slow first sync).
# Pinging its health endpoint every 10 minutes keeps it awake. Lives in this public repo
# because scheduled runs here don't use any of the account's Actions minutes.
name: Keep sync server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping dayplan-server health
        run: curl --silent --show-error --fail --retry 3 --retry-delay 10 --max-time 90 https://dayplan-server.onrender.com/api/health
